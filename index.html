<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="来一口美味蛋挞">
<meta name="theme-color" content="#f2f2f2">
<link rel="apple-touch-icon" href="https://nos.netease.com/ysf/382f5f92aaf1795b289034118b1187c9.jpeg">
<title>来一口美味蛋挞</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f2f2;--card:rgba(255,255,255,.85);--text:#111;--t2:#666;--t3:#aaa;--border:rgba(0,0,0,.07);--acc:#111;--tag-bg:rgba(0,0,0,.05);--tag-on:#111;--r:14px;--font:'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;--sh1:0 1px 2px rgba(0,0,0,.04);--sh2:0 2px 8px rgba(0,0,0,.06);--sh3:0 8px 24px rgba(0,0,0,.08)}
html,body{height:100vh;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;font-weight:300;font-size:14px;line-height:1.6}
body{display:flex;align-items:center;justify-content:center}
.phone{width:100%;max-width:430px;height:100vh;max-height:932px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:460px){.phone{height:93vh;box-shadow:0 24px 80px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.12);border-radius:40px}}
@media (display-mode: standalone){.phone{max-width:100%;max-height:100vh;width:100vw;height:100vh;border-radius:0}}

.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);opacity:0;transition:transform .35s cubic-bezier(.32,.72,.32,1),opacity .22s;background:var(--bg);z-index:10}
.screen.active{transform:translateX(0);opacity:1}
.screen.home{transform:translateX(0);opacity:1;z-index:1}
.screen::-webkit-scrollbar{width:0}
.home-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.home-inner{position:relative;z-index:1;padding:0 28px 20px;min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.clock-area{padding:56px 0 36px;text-align:center}
.clock-time{font-size:68px;font-weight:200;letter-spacing:-3px;line-height:1}
.clock-date{font-size:11px;color:var(--t2);margin-top:8px;letter-spacing:2px}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 14px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;-webkit-user-select:none}
.app-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--card);backdrop-filter:blur(20px);border:.5px solid var(--border);transition:transform .12s;position:relative}
.app:active .app-icon{transform:scale(.88)}
.app-name{font-size:10px;color:var(--t2);letter-spacing:.3px}
.badge{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;background:#222;border-radius:8px;font-size:8px;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 4px}
.dock{margin-top:auto;padding:18px 16px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:22px}
.dock .app-icon{width:48px;height:48px;border-radius:13px}

.nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(30px);background:rgba(242,242,242,.88);padding:calc(13px + env(safe-area-inset-top)) 18px 11px;display:flex;align-items:center;gap:10px;border-bottom:.5px solid var(--border)}
.back-btn{background:none;border:none;color:var(--text);font-size:13px;cursor:pointer;font-family:var(--font);font-weight:400;padding:4px 0;margin-right:auto}
.nav-act{background:none;border:none;color:var(--t2);font-size:12px;cursor:pointer;font-family:var(--font);padding:6px 14px;border-radius:20px;transition:all .15s;font-weight:400}
.nav-act:active{transform:scale(.94)}
.nav-act.solid{background:var(--acc);color:#fff;box-shadow:var(--sh2)}
.content{padding:18px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.st{font-size:10px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin:22px 0 9px;font-weight:500}
.st:first-child{margin-top:0}
.hint{font-size:11px;color:var(--t3);line-height:1.7;margin-bottom:12px}
.card{background:var(--card);backdrop-filter:blur(16px);border:.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:9px;cursor:pointer;transition:transform .12s,box-shadow .2s;box-shadow:var(--sh1)}
.card:active{transform:scale(.985);box-shadow:var(--sh2)}
.card .c-t{font-size:13px;font-weight:500;margin-bottom:3px}
.card .c-b{font-size:11px;color:var(--t2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.card .c-m{font-size:9px;color:var(--t3);margin-top:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.c-tag{font-size:9px;padding:2px 8px;border-radius:6px;background:var(--tag-bg);color:var(--t2)}
.empty{text-align:center;padding:44px 20px;color:var(--t3);font-size:11px;line-height:1.8}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;color:var(--t3);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;font-weight:500}
.field input,.field textarea,.field select{width:100%;background:var(--card);border:.5px solid var(--border);border-radius:11px;padding:11px 13px;color:var(--text);font-size:13px;font-family:var(--font);font-weight:300;transition:border .2s,box-shadow .2s;box-shadow:var(--sh1)}
.field textarea{min-height:80px;line-height:1.7;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.field input::placeholder,.field textarea::placeholder{color:#bbb}
.tags-wrap{margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.tag{font-size:11.5px;padding:6px 13px;border-radius:20px;background:var(--card);color:var(--t2);cursor:pointer;transition:all .15s;-webkit-user-select:none;display:inline-flex;align-items:center;gap:5px;border:.5px solid var(--border);box-shadow:var(--sh1)}
.tag.on{background:var(--tag-on);color:#fff;border-color:var(--tag-on);box-shadow:var(--sh2)}
.tag:active{transform:scale(.92)}
.tag-x{font-size:14px;font-weight:400;opacity:.55;cursor:pointer;line-height:1;margin-left:1px;padding:0 2px;border-radius:50%}
.tag.on .tag-x{opacity:.8}
.custom-tag-input{display:flex;gap:6px}
.custom-tag-input input{flex:1;padding:8px 12px;font-size:11px;border-radius:10px;border:.5px solid var(--border);background:var(--card);color:var(--text);font-family:var(--font);box-shadow:var(--sh1)}
.custom-tag-input input:focus{outline:none;border-color:var(--acc)}
.custom-tag-input button{padding:8px 15px;font-size:13px;border-radius:10px;border:none;background:var(--acc);color:#fff;cursor:pointer;transition:transform .12s;box-shadow:var(--sh2)}
.custom-tag-input button:active{transform:scale(.9)}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);letter-spacing:.3px;transition:transform .12s,box-shadow .2s;box-shadow:var(--sh2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(145deg,#2a2a2a,#111);color:#fff}
.btn.ghost{background:var(--card);color:var(--text);border:.5px solid var(--border);box-shadow:var(--sh1)}
.btn.outline{background:none;border:.5px solid var(--border);color:var(--t2);box-shadow:none}
.btn.danger{background:none;border:.5px solid rgba(204,0,0,.4);color:#c00;box-shadow:none}
.btn:disabled{opacity:.4;box-shadow:none}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row .btn{margin:0}
.btn-sm{padding:8px 14px;font-size:11px;width:auto;border-radius:10px}
.switch{position:relative;width:42px;height:24px;flex:0 0 42px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#d8d8d8;border-radius:24px;transition:.25s;cursor:pointer}
.slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:var(--acc)}
.switch input:checked+.slider::before{transform:translateX(18px)}
.si{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:.5px solid var(--border);cursor:pointer;transition:opacity .15s}
.si:active{opacity:.55}
.si:last-child{border:none}
.si-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--tag-bg);flex:0 0 30px;color:var(--t2)}
.si-label{flex:1}
.si-t{font-size:13px}
.si-s{font-size:10px;color:var(--t3);margin-top:2px}
.si-arr{color:var(--t3);font-size:14px}
.rb{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh1)}
.rb-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:12px;font-weight:500;border-bottom:.5px solid var(--border)}
.rb textarea{width:100%;border:none;background:transparent;color:var(--text);padding:12px 14px;font-size:12px;line-height:1.7;min-height:160px;font-family:var(--font);font-weight:300;resize:vertical}
.rb textarea:focus{outline:none}
.mm{position:absolute;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(3px);z-index:600;display:none;align-items:flex-end}
.mm.show{display:flex}
.modal{width:100%;background:var(--bg);border-radius:20px 20px 0 0;padding:22px 20px calc(30px + env(safe-area-inset-bottom));max-height:82%;overflow-y:auto;animation:mup .32s cubic-bezier(.32,.72,.32,1);box-shadow:0 -8px 40px rgba(0,0,0,.15)}
@keyframes mup{from{transform:translateY(100%)}}
.modal h3{font-size:15px;font-weight:500;margin-bottom:16px}
.lm{position:absolute;inset:0;background:rgba(242,242,242,.92);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:500;gap:14px}
.lm.show{display:flex}
.dots{display:flex;gap:5px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:bce .6s infinite alternate}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes bce{to{opacity:.15;transform:translateY(-6px)}}
.lm p{font-size:10px;color:var(--t3);letter-spacing:1.5px}
.toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--acc);color:#fff;padding:9px 20px;border-radius:22px;font-size:11px;opacity:0;transition:.25s;z-index:999;pointer-events:none;white-space:nowrap;box-shadow:var(--sh3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kw-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.kw-chip{font-size:9px;padding:2px 7px;border-radius:6px;background:var(--tag-bg);color:var(--t2)}
.gen-sec{margin-bottom:18px}
.gen-sec-t{font-size:11px;color:var(--t2);margin-bottom:8px;font-weight:500;display:flex;align-items:center;gap:6px}
.gen-sec-t::before{content:'';width:3px;height:11px;background:var(--acc);border-radius:2px;display:inline-block}
.inspire-box{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:16px;box-shadow:var(--sh1)}
.inspire-box textarea{border:none;background:none;width:100%;font-size:13px;color:var(--text);font-family:var(--font);font-weight:300;line-height:1.7;min-height:60px;resize:none}
.inspire-box textarea:focus{outline:none}
.kb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:.5px solid var(--border);border-radius:11px;margin-bottom:6px;cursor:pointer;transition:.15s;box-shadow:var(--sh1)}
.kb-item.on{border-color:var(--acc);background:var(--tag-on);color:#fff}
.kb-item.on .kb-name,.kb-item.on .kb-type{color:#fff}
.kb-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);flex:0 0 18px;display:flex;align-items:center;justify-content:center;font-size:10px;transition:.15s}
.kb-item.on .kb-check{background:#fff;border-color:#fff;color:var(--acc)}
.kb-name{font-size:11.5px;flex:1}
.kb-type{font-size:9px;color:var(--t3)}
.ref-card{background:var(--card);border:.5px solid var(--border);border-radius:11px;padding:11px;margin-bottom:6px;cursor:pointer;transition:.15s;box-shadow:var(--sh1)}
.ref-card.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(0,0,0,.06)}
.ref-card .rc-t{font-size:11.5px;font-weight:500}
.ref-card .rc-b{font-size:10px;color:var(--t3);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.divider{height:.5px;background:var(--border);margin:18px 0}
.row-2{display:flex;gap:8px}
.row-2>*{flex:1}
.fold-head{display:flex;align-items:center;gap:8px;padding:11px 0;cursor:pointer;border-bottom:.5px solid var(--border)}
.fold-head .fh-t{font-size:13px;font-weight:500;flex:1}
.fold-head .fh-n{font-size:10px;color:var(--t3)}
.fold-head .fh-arr{color:var(--t3);transition:transform .2s;font-size:10px}
.fold-head.open .fh-arr{transform:rotate(90deg)}
.fold-body{display:none;padding:8px 0}
.fold-head.open+.fold-body{display:block}
.copy-btn{background:var(--card);border:.5px solid var(--border);border-radius:8px;padding:5px 11px;font-size:10px;color:var(--t2);cursor:pointer;font-family:var(--font);transition:.12s;box-shadow:var(--sh1)}
.copy-btn:active{transform:scale(.93)}
.inspire-pick{background:var(--card);border:.5px solid var(--border);border-radius:11px;padding:11px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:9px;box-shadow:var(--sh1)}
.inspire-pick.on{border-color:var(--acc)}
.inspire-pick .ip-b{font-size:11px;color:var(--t2);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.font-card{padding:13px;background:var(--card);border:.5px solid var(--border);border-radius:var(--r);margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:var(--sh1)}
.font-card.active{border-color:var(--acc);box-shadow:0 0 0 2px rgba(0,0,0,.06)}
.font-card .fc-name{font-size:13px;flex:1}
.font-card .fc-del{font-size:11px;color:#c00;cursor:pointer;padding:4px 8px}

/* 聊天应用 - 仿微信/ins 灰白风 */
.chat-app{display:flex;flex-direction:column;height:100%;background:#f7f7f7}
.chat-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.chat-body::-webkit-scrollbar{width:0}
.chat-bottom-bar{display:flex;align-items:stretch;border-top:.5px solid var(--border);background:rgba(247,247,247,.96);backdrop-filter:blur(20px);height:calc(54px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);flex:0 0 auto}
.chat-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:#b0b0b0;transition:.15s}
.chat-bar-item.on{color:var(--text)}
.chat-bar-item svg{opacity:.55;transition:.15s}
.chat-bar-item.on svg{opacity:1}
.chat-bar-label{font-size:9px;letter-spacing:.3px}
.chat-list-header,.contact-header{padding:calc(52px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center}
.chat-list-header h1,.contact-header h1{font-size:26px;font-weight:400;flex:1;letter-spacing:-.5px;cursor:pointer}
.chat-list-item,.contact-item{display:flex;align-items:center;gap:13px;padding:12px 20px;cursor:pointer;transition:background .12s}
.chat-list-item:active,.contact-item:active{background:rgba(0,0,0,.04)}
.chat-avatar,.contact-avatar{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#eaeaea,#d2d2d2);display:flex;align-items:center;justify-content:center;flex:0 0 48px;font-size:18px;font-weight:400;color:var(--t2);letter-spacing:-1px;overflow:hidden}
.contact-avatar{width:42px;height:42px;flex:0 0 42px;font-size:15px;border-radius:12px}
.chat-avatar img,.contact-avatar img{width:100%;height:100%;object-fit:cover}
.chat-info,.contact-info{flex:1;overflow:hidden;border-bottom:.5px solid var(--border);padding-bottom:12px;min-width:0}
.contact-info{padding:10px 0}
.chat-list-item:last-child .chat-info,.contact-item:last-child .contact-info{border:none}
.chat-name,.contact-name{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.chat-name-time{font-size:9px;color:var(--t3);font-weight:300;margin-left:auto;flex:0 0 auto}
.chat-last{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;font-weight:300}
.contact-sub{font-size:10px;color:var(--t3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chat-win{display:flex;flex-direction:column;height:100%;background:#ededed}
.chat-win-header{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:rgba(247,247,247,.94);backdrop-filter:blur(30px);border-bottom:.5px solid var(--border);min-height:56px;box-shadow:0 1px 8px rgba(0,0,0,.03);z-index:5}
.chat-win-avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#e2e2e2,#cecece);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t2);overflow:hidden;flex:0 0 34px}
.chat-win-avatar img{width:100%;height:100%;object-fit:cover}
.chat-win-info{flex:1;cursor:pointer;min-width:0}
.chat-win-name{font-size:15px;font-weight:500}
.chat-win-status{font-size:9px;color:var(--t3);margin-top:1px}
.chat-win-cfg{background:none;border:none;color:var(--t2);cursor:pointer;padding:6px;font-size:18px}
.chat-messages{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:2px;background:#ededed}
.chat-messages::-webkit-scrollbar{width:0}
.msg-row{display:flex;align-items:flex-start;gap:9px;margin:3px 0;max-width:100%}
.msg-row.user{flex-direction:row-reverse}
.msg-av{width:36px;height:36px;border-radius:10px;overflow:hidden;flex:0 0 36px;background:linear-gradient(135deg,#e2e2e2,#cecece);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2)}
.msg-av img{width:100%;height:100%;object-fit:cover}
.msg-col{display:flex;flex-direction:column;max-width:72%;min-width:0}
.msg-row.user .msg-col{align-items:flex-end}
.msg-sender{font-size:9px;color:var(--t3);margin:0 2px 3px;letter-spacing:.3px}
.msg{padding:9px 13px;font-size:14px;line-height:1.5;font-weight:300;word-break:break-word;white-space:pre-wrap;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.msg.ai{background:#fff;border-radius:3px 15px 15px 15px;color:var(--text)}
.msg.user-msg{background:#95ec69;color:#111;border-radius:15px 3px 15px 15px}
.msg.sys{background:rgba(0,0,0,.06);color:var(--t3);font-size:10px;align-self:center;text-align:center;max-width:80%;padding:4px 12px;border-radius:8px;margin:10px 0;box-shadow:none;white-space:normal}
.typing-row{display:flex;align-items:flex-start;gap:9px;margin:3px 0}
.typing-indicator{display:flex;align-items:center;gap:4px;padding:13px 15px;background:#fff;border-radius:3px 15px 15px 15px}
.typing-indicator span{width:6px;height:6px;border-radius:50%;background:#bbb;animation:typd .8s infinite alternate}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes typd{to{opacity:.2;transform:translateY(-4px)}}
.chat-input-area{background:rgba(247,247,247,.96);backdrop-filter:blur(20px);border-top:.5px solid var(--border);padding:9px 12px calc(12px + env(safe-area-inset-bottom))}
.chat-input-row{display:flex;align-items:flex-end;gap:9px}
.chat-input-row textarea{flex:1;background:#fff;border:.5px solid var(--border);border-radius:20px;padding:10px 16px;font-size:14px;font-family:var(--font);font-weight:300;color:var(--text);resize:none;max-height:100px;line-height:1.5;transition:border .2s;box-shadow:var(--sh1)}
.chat-input-row textarea:focus{outline:none;border-color:#bbb}
.chat-input-row textarea::placeholder{color:#bbb}
.chat-send-btn{width:36px;height:36px;border-radius:12px;background:#95ec69;border:none;color:#111;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 36px;transition:all .15s;box-shadow:var(--sh2)}
.chat-send-btn:active{transform:scale(.88)}
.chat-send-btn:disabled{background:#ccc;color:#fff}

function readDocx(file,cb){file.arrayBuffer().then(function(buf){var dv=new DataView(buf),u8=new Uint8Array(buf);var target=null,off=0;/* 找 central directory 定位 word/document.xml */for(var i=0;i<u8.length-4;i++){if(dv.getUint32(i,true)===0x04034b50){var nameLen=dv.getUint16(i+26,true),extra=dv.getUint16(i+28,true),comp=dv.getUint16(i+8,true),csize=dv.getUint32(i+18,true);var name=new TextDecoder().decode(u8.subarray(i+30,i+30+nameLen));var dataStart=i+30+nameLen+extra;if(name==='word/document.xml'){target={comp:comp,start:dataStart,size:csize};break}}}if(!target){cb('未找到文档内容');return}var raw=u8.subarray(target.start,target.start+target.size);function done(xmlBytes){var xml=new TextDecoder().decode(xmlBytes);var text=xml.replace(/<w:p[ >]/g,'\n<w:p ').replace(/<[^>]+>/g,function(m){return/<w:t[ >]/.test(m)?'':m}).replace(/<\/w:t>/g,'');/* 更稳妥地抽取 w:t 文本 */var out='';var re=/<w:p\b[^>]*>([\s\S]*?)<\/w:p>/g,mp;var buf2='';while((mp=re.exec(xml))){var seg=mp[1];var tre=/<w:t[^>]*>([\s\S]*?)<\/w:t>/g,mt,line='';while((mt=tre.exec(seg))){line+=mt[1]}buf2+=line.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"')+'\n'}cb(null,buf2.trim())}if(target.comp===0){done(raw)}else if(typeof DecompressionStream!=='undefined'){var ds=new DecompressionStream('deflate-raw');var rs=new Response(new Blob([raw]).stream().pipeThrough(ds));rs.arrayBuffer().then(function(ab){done(new Uint8Array(ab))}).catch(function(){cb('解析失败：浏览器不支持解压')})}else{cb('当前浏览器不支持 docx 解压')}}).catch(function(){cb('读取失败')})}

function openStorage(){var view='all';openScreen(function(el){render();function render(){el.innerHTML=navHTML('存储');var bd=document.createElement('div');bd.className='content';var tabs=['全部','角色分组','角色设定','User设定','世界观','世界书','灵感库'];var tabIds=['all','grouped','persona','user','worldview','worldbook','inspire'];var th='<div class="tags" style="margin-bottom:14px">';for(var i=0;i<tabs.length;i++){th+='<span class="tag'+(view===tabIds[i]?' on':'')+'" data-v="'+tabIds[i]+'">'+tabs[i]+'</span>'}th+='</div><div id="sList"></div>';bd.innerHTML=th;el.appendChild(bd);bd.querySelector('.tags').onclick=function(e){var t=e.target.closest('.tag');if(t){view=t.getAttribute('data-v');render()}};var list=bd.querySelector('#sList');var nameMap={persona:'角色设定',user:'User设定',worldview:'世界观',worldbook:'世界书',inspire:'灵感库'};if(!D.storage.length){list.innerHTML='<div class="empty">还没有内容</div>';return}if(view==='grouped'){var groups={};var ung=[];for(var i=0;i<D.storage.length;i++){var s=D.storage[i];if(s.group){if(!groups[s.group])groups[s.group]=[];groups[s.group].push(s)}else ung.push(s)}var h='';for(var name in groups){var items=groups[name];h+='<div style="display:flex;align-items:center;gap:8px;margin:14px 0 6px"><div style="font-size:13px;font-weight:500;flex:1">'+esc(name)+' ('+items.length+')</div><button class="btn-sm btn ghost" data-import-group="'+esc(name)+'">导入聊天</button></div>';for(var i=items.length-1;i>=0;i--)h+=cardH(items[i],nameMap)}if(ung.length){h+='<div class="st">未分组 ('+ung.length+')</div>';for(var i=ung.length-1;i>=0;i--)h+=cardH(ung[i],nameMap)}list.innerHTML=h}else{var filtered=view==='all'?D.storage:D.storage.filter(function(s){return s.type===view});if(!filtered.length){list.innerHTML='<div class="empty">该分类暂无内容</div>';return}var h='';if(view==='all'){var byT={};for(var i=0;i<filtered.length;i++){var s=filtered[i];if(!byT[s.type])byT[s.type]=[];byT[s.type].push(s)}for(var t in byT){h+='<div class="st">'+(nameMap[t]||t)+' ('+byT[t].length+')</div>';for(var i=byT[t].length-1;i>=0;i--)h+=cardH(byT[t][i],nameMap)}}else{for(var i=filtered.length-1;i>=0;i--)h+=cardH(filtered[i],nameMap)}list.innerHTML=h}list.onclick=function(e){var impBtn=e.target.closest('[data-import-group]');if(impBtn){importGroupToChat(impBtn.getAttribute('data-import-group'));return}var c=e.target.closest('.card[data-id]');if(!c)return;var item=D.storage.filter(function(x){return x.id===c.getAttribute('data-id')})[0];if(item)viewItem(item,render)}}})}
function importGroupToChat(groupName){var items=D.storage.filter(function(s){return s.group===groupName});if(!items.length)return toast('该组没有内容');var pI=null,uI=null,wvI=null,wbIs=[];for(var i=0;i<items.length;i++){var s=items[i];if(s.type==='persona'&&!pI)pI=s;else if(s.type==='user'&&!uI)uI=s;else if(s.type==='worldview'&&!wvI)wvI=s;else if(s.type==='worldbook')wbIs.push(s)}if(!pI)return toast('该组没有角色设定');var cid=uid();var ct={id:cid,name:groupName||pI.title,persona:pI.content||'',userSetting:'',worldview:wvI?wvI.content:'',worldbook:[],avatar:'',imported:Date.now(),boundMaskId:''};for(var i=0;i<wbIs.length;i++){ct.worldbook.push({id:uid(),name:wbIs[i].title||'世界书条目',content:wbIs[i].content||'',position:'before',keywords:'',enabled:true})}if(uI){var mk={id:uid(),name:groupName+' 面具',content:uI.content||'',avatar:''};D.userMasks.push(mk);ct.boundMaskId=mk.id;if(!D.defaultMaskId)D.defaultMaskId=mk.id}D.chatContacts.push(ct);var newChat={id:uid(),contactId:cid,name:ct.name,messages:[],created:Date.now(),lastMsg:'',lastTime:Date.now(),maskId:ct.boundMaskId||D.defaultMaskId||''};D.chats.push(newChat);save();toast('已导入聊天：'+ct.name)}

function viewItem(item,refresh){openScreen(function(el){el.innerHTML=navHTML(item.typeName||'详情');var bd=document.createElement('div');bd.className='content';bd.innerHTML='<div class="field"><label>标题</label><input id="et" value="'+esc(item.title)+'"></div><div class="field"><label>绑定角色名</label><input id="eg" value="'+esc(item.group||'')+'" placeholder="角色名"></div><div class="field"><label>内容</label><textarea id="ec" style="min-height:300px">'+esc(item.content)+'</textarea></div><div class="c-m" style="margin-bottom:12px">'+fdt(item.created)+'</div><div class="btn-row"><button class="btn primary" id="sv">保存</button><button class="btn ghost" id="cp">复制</button><button class="btn outline" id="exp">导出</button><button class="btn danger" id="dl">删除</button></div>';el.appendChild(bd);bd.querySelector('#sv').onclick=function(){item.title=bd.querySelector('#et').value.trim();item.content=bd.querySelector('#ec').value.trim();item.group=bd.querySelector('#eg').value.trim();save();toast('已保存');back();if(refresh)refresh();renderHome()};bd.querySelector('#cp').onclick=function(){copyText(bd.querySelector('#ec').value)};bd.querySelector('#exp').onclick=function(){exportFile(item.title,bd.querySelector('#ec').value)};bd.querySelector('#dl').onclick=function(){D.storage=D.storage.filter(function(x){return x.id!==item.id});save();toast('已删除');back();if(refresh)refresh();renderHome()}})}

function openWallpaperPage(){openScreen(function(el){el.innerHTML=navHTML('壁纸');var bd=document.createElement('div');bd.className='content';bd.innerHTML='<div class="hint">上传图片保存到本地，或输入URL。刷新不丢失。</div><div class="field"><label>图片URL</label><input id="wpUrl" value="'+esc(D.wallpaperUrl||'')+'" placeholder="https://..."></div><div class="btn-row"><button class="btn primary" id="wpApplyUrl">应用URL</button><button class="btn ghost" id="wpUpload">上传图片</button></div><input type="file" id="wpFile" accept="image/*" style="display:none"><div id="wpStatus" style="font-size:10px;color:var(--t3);margin-top:12px">'+(D.wallpaper==='indexeddb'?'当前：已上传图片':D.wallpaperUrl?'当前：URL壁纸':'当前：无壁纸')+'</div><div class="divider"></div><button class="btn outline" id="wpClear">清除壁纸</button>';el.appendChild(bd);bd.querySelector('#wpApplyUrl').onclick=function(){var url=bd.querySelector('#wpUrl').value.trim();if(!url)return toast('请输入URL');D.wallpaperUrl=url;D.wallpaper='';clearWpFromDB();save();applyWallpaper();bd.querySelector('#wpStatus').textContent='当前：URL壁纸';toast('已应用')};bd.querySelector('#wpUpload').onclick=function(){bd.querySelector('#wpFile').click()};bd.querySelector('#wpFile').onchange=function(e){var f=e.target.files[0];if(!f)return;var img=new Image();img.onload=function(){var maxW=1200;var w=img.width;var h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);canvas.toBlob(function(blob){saveWpToDB(blob,function(){D.wallpaper='indexeddb';D.wallpaperUrl='';save();applyWallpaper();bd.querySelector('#wpStatus').textContent='当前：已上传图片';toast('已保存')})},'image/jpeg',0.85)};img.src=URL.createObjectURL(f)};bd.querySelector('#wpClear').onclick=function(){D.wallpaper='';D.wallpaperUrl='';save();clearWpFromDB();applyWallpaper();bd.querySelector('#wpStatus').textContent='当前：无壁纸';toast('已清除')}})}

  function renderContacts(p){var h='<div class="contact-header"><h1 onclick="back()">联系人</h1><button class="nav-act solid" id="addCt">+ 新建</button></div>';if(!D.chatContacts.length){h+='<div class="empty" style="padding-top:60px">暂无联系人<br>从存储导入或点右上角新建</div>'}else{for(var i=0;i<D.chatContacts.length;i++){var ct=D.chatContacts[i];h+='<div class="contact-item" data-ctid="'+ct.id+'">'+avatarHTML(ct.avatar,42,(ct.name||'?')[0],'contact-avatar')+'<div class="contact-info"><div class="contact-name">'+esc(ct.name)+'</div><div class="contact-sub">'+(ct.persona?esc(ct.persona.slice(0,30))+'...':'未设置')+'</div></div></div>'}}p.innerHTML=h;p.querySelector('#addCt').onclick=function(){showModal('<h3>新建联系人</h3><div class="field"><label>名称</label><input id="ncN" placeholder="角色名"></div><div class="field"><label>角色设定</label><textarea id="ncP" placeholder="粘贴角色设定"></textarea></div><div class="btn-row"><button class="btn primary" id="ncS">创建</button><button class="btn ghost" onclick="closeModal()">取消</button></div>');$('ncS').onclick=function(){var n=$('ncN').value.trim();if(!n)return toast('请输入名称');D.chatContacts.push({id:uid(),name:n,persona:$('ncP').value,userSetting:'',worldview:'',worldbook:[],avatar:'',imported:Date.now(),boundMaskId:''});save();closeModal();renderContacts(p)}};p.onclick=function(e){var c=e.target.closest('.contact-item');if(c){var ct=D.chatContacts.filter(function(x){return x.id===c.getAttribute('data-ctid')})[0];if(ct)editCt(ct,function(){renderContacts(p)})}}}
  function editCt(ct,onDone){openScreen(function(el){el.innerHTML=navHTML(ct.name);var bd=document.createElement('div');bd.className='content';bd.innerHTML='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'+avatarHTML(ct.avatar,56,(ct.name||'?')[0],'chat-win-avatar')+'<button class="btn-sm btn ghost" id="ecAv">更换头像</button></div><div class="field"><label>名称</label><input id="ecn" value="'+esc(ct.name)+'"></div><div class="field"><label>角色设定</label><textarea id="ecp" style="min-height:150px">'+esc(ct.persona)+'</textarea></div><div class="field"><label>世界观</label><textarea id="ecw" style="min-height:80px">'+esc(ct.worldview)+'</textarea></div><div class="btn-row"><button class="btn primary" id="ecS">保存</button><button class="btn danger" id="ecD">删除</button></div>';el.appendChild(bd);bd.querySelector('#ecAv').onclick=function(){pickAvatar(function(src){ct.avatar=src;save();back();if(onDone)onDone()})};bd.querySelector('#ecS').onclick=function(){ct.name=bd.querySelector('#ecn').value.trim();ct.persona=bd.querySelector('#ecp').value;ct.worldview=bd.querySelector('#ecw').value;save();toast('已保存');back();if(onDone)onDone()};bd.querySelector('#ecD').onclick=function(){D.chatContacts=D.chatContacts.filter(function(x){return x.id!==ct.id});D.chats=D.chats.filter(function(x){return x.contactId!==ct.id});save();toast('已删除');back();if(onDone)onDone()}})}
  function renderCWB(p){var h='<div class="chat-list-header"><h1 onclick="back()">世界书</h1><button class="nav-act solid" id="cwbA">+ 新建</button></div><div style="padding:0 20px"><div class="hint">全局聊天世界书，与外部知识库独立。</div>';if(!D.chatWorldbook.length){h+='<div class="empty">暂无条目</div>'}else{for(var i=0;i<D.chatWorldbook.length;i++){var w=D.chatWorldbook[i];var pn=w.position==='before'?'前段':w.position==='after'?'后段':'中段';h+='<div class="wb-entry'+(w.enabled?' wb-entry-on':'')+'" data-gi="'+i+'"><div style="display:flex;align-items:center;gap:6px"><div class="wb-t" style="flex:1">'+esc(w.name)+'</div><label class="switch" onclick="event.stopPropagation()"><input type="checkbox" '+(w.enabled?'checked':'')+' data-gt="'+i+'"><span class="slider"></span></label></div><div class="wb-pos">'+pn+(w.keywords?' · '+esc(w.keywords):' · 常驻')+'</div></div>'}}h+='</div>';p.innerHTML=h;p.querySelector('#cwbA').onclick=function(){D.chatWorldbook.push({id:uid(),name:'新条目',content:'',position:'before',keywords:'',enabled:true});save();renderCWB(p)};p.onclick=function(e){var tog=e.target.closest('[data-gt]');if(tog){var idx=parseInt(tog.getAttribute('data-gt'));D.chatWorldbook[idx].enabled=tog.checked;save();return}var en=e.target.closest('[data-gi]');if(en){editCWE(D.chatWorldbook,parseInt(en.getAttribute('data-gi')),function(){renderCWB(p)})}}}
  function renderCUser(p){var cur=getDefaultMask();var h='<div class="chat-list-header"><h1 onclick="back()">面具</h1><button class="nav-act solid" id="cuA">+ 新建</button></div><div style="padding:0 20px">';if(cur){h+='<div class="mask-namecard"><div class="mnc-top"><div class="mnc-av" id="mncAv">'+(cur.avatar?'<img src="'+esc(cur.avatar)+'">':esc((cur.name||'?')[0]))+'</div><div><div class="mnc-name">'+esc(cur.name)+'</div><div class="mnc-sub">当前使用中 · 点头像换图</div></div></div><div class="mnc-body">'+esc(cur.content||'（暂无设定）')+'</div></div>';h+='<div class="mask-switch-row">';for(var i=0;i<D.userMasks.length;i++){var mk=D.userMasks[i];h+='<div class="mask-mini'+(D.defaultMaskId===mk.id?' on':'')+'" data-mk="'+mk.id+'"><div class="mask-mini-av">'+(mk.avatar?'<img src="'+esc(mk.avatar)+'">':esc((mk.name||'?')[0]))+'</div><div class="mask-mini-name">'+esc(mk.name)+'</div></div>'}h+='<div class="mask-add-mini" id="mAdd"><div class="maa">+</div><div class="mask-mini-name">新建</div></div></div>';h+='<div class="btn-row"><button class="btn primary" id="mEdit">编辑此面具</button><button class="btn danger" id="mDel">删除</button></div>'}else{h+='<div class="empty">还没有面具<br>点右上角新建</div>'}h+='<div class="st">全局User设定（无面具时兜底）</div><div class="field"><textarea id="cuT" style="min-height:80px">'+esc(D.chatUserSetting||'')+'</textarea></div><button class="btn ghost" id="cuSv" style="margin-bottom:16px">保存全局设定</button>';var userItems=D.storage.filter(function(s){return s.type==='user'});if(userItems.length){h+='<div class="st">从存储导入为面具</div>';for(var i=0;i<userItems.length;i++){h+='<div class="card" data-imp="'+userItems[i].id+'"><div class="c-t">'+esc(userItems[i].title)+'</div><div class="c-b">'+esc((userItems[i].content||'').slice(0,60))+'</div></div>'}}h+='</div>';p.innerHTML=h;var avEl=p.querySelector('#mncAv');if(avEl)avEl.onclick=function(){if(cur)pickAvatar(function(src){cur.avatar=src;save();renderCUser(p)})};p.querySelector('#cuSv').onclick=function(){D.chatUserSetting=p.querySelector('#cuT').value;save();toast('已保存')};var addBtn=p.querySelector('#cuA');addBtn.onclick=newMask;var mAdd=p.querySelector('#mAdd');if(mAdd)mAdd.onclick=newMask;function newMask(){showModal('<h3>新建面具</h3><div class="field"><label>面具名称</label><input id="mnN" placeholder="如：小透"></div><div class="field"><label>面具设定</label><textarea id="mnC" placeholder="粘贴User设定"></textarea></div><div class="btn-row"><button class="btn primary" id="mnS">创建</button><button class="btn ghost" onclick="closeModal()">取消</button></div>');$('mnS').onclick=function(){var n=$('mnN').value.trim();if(!n)return toast('请输入名称');var mk={id:uid(),name:n,content:$('mnC').value,avatar:''};D.userMasks.push(mk);D.defaultMaskId=mk.id;save();closeModal();renderCUser(p)}}var mEdit=p.querySelector('#mEdit');if(mEdit)mEdit.onclick=function(){editMask(cur,function(){renderCUser(p)})};var mDel=p.querySelector('#mDel');if(mDel)mDel.onclick=function(){D.userMasks=D.userMasks.filter(function(x){return x.id!==cur.id});D.defaultMaskId=D.userMasks.length?D.userMasks[0].id:'';save();renderCUser(p);toast('已删除')};p.onclick=function(e){var mini=e.target.closest('.mask-mini');if(mini){D.defaultMaskId=mini.getAttribute('data-mk');save();renderCUser(p);return}var imp=e.target.closest('[data-imp]');if(imp){var item=D.storage.filter(function(x){return x.id===imp.getAttribute('data-imp')})[0];if(item){var mk={id:uid(),name:item.title||'面具',content:item.content||'',avatar:''};D.userMasks.push(mk);D.defaultMaskId=mk.id;save();renderCUser(p);toast('已导入为面具')}}}}
  function editMask(mk,onDone){if(!mk)return;openScreen(function(el){el.innerHTML=navHTML(mk.name);var bd=document.createElement('div');bd.className='content';bd.innerHTML='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'+avatarHTML(mk.avatar,56,(mk.name||'?')[0],'chat-win-avatar')+'<button class="btn-sm btn ghost" id="mkAv">更换头像</button></div><div class="field"><label>名称</label><input id="mkN" value="'+esc(mk.name)+'"></div><div class="field"><label>面具设定</label><textarea id="mkC" style="min-height:200px">'+esc(mk.content)+'</textarea></div><button class="btn primary" id="mkSv">保存</button>';el.appendChild(bd);bd.querySelector('#mkAv').onclick=function(){pickAvatar(function(src){mk.avatar=src;save();back();if(onDone)onDone()})};bd.querySelector('#mkSv').onclick=function(){mk.name=bd.querySelector('#mkN').value.trim();mk.content=bd.querySelector('#mkC').value;save();toast('已保存');back();if(onDone)onDone()}})}

function editCWE(arr,idx,onDone){var item=arr[idx];if(!item)return;showModal('<h3>编辑世界书条目</h3><div class="field"><label>名称</label><input id="ewn" value="'+esc(item.name)+'"></div><div class="field"><label>注入位置</label><select id="ewp"><option value="before"'+(item.position==='before'?' selected':'')+'>前段</option><option value="middle"'+(item.position==='middle'?' selected':'')+'>中段</option><option value="after"'+(item.position==='after'?' selected':'')+'>后段</option></select></div><div class="field"><label>触发关键词（逗号分隔，留空=常驻）</label><input id="ewk" value="'+esc(item.keywords||'')+'"></div><div class="field"><label>内容</label><textarea id="ewc" style="min-height:100px">'+esc(item.content)+'</textarea></div><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span style="font-size:11px">启用</span><label class="switch"><input type="checkbox" id="ewe" '+(item.enabled?'checked':'')+'><span class="slider"></span></label></div><div class="btn-row"><button class="btn primary" id="ewS">保存</button><button class="btn danger" id="ewD">删除</button></div>');$('ewS').onclick=function(){item.name=$('ewn').value.trim();item.position=$('ewp').value;item.keywords=$('ewk').value.trim();item.content=$('ewc').value;item.enabled=$('ewe').checked;save();closeModal();if(onDone)onDone()};$('ewD').onclick=function(){arr.splice(idx,1);save();closeModal();if(onDone)onDone()}}

function buildCS(ct,chat){var msgs=[];msgs.push({role:'system',content:getChatSys()});if(!ct)return msgs;var bP=[];if(ct.worldview)bP.push(ct.worldview);var wb=ct.worldbook||[];for(var i=0;i<wb.length;i++){if(wb[i].enabled&&wb[i].position==='before'&&(!wb[i].keywords||sT(wb[i].keywords,chat)))bP.push('['+wb[i].name+']\n'+wb[i].content)}for(var i=0;i<D.chatWorldbook.length;i++){var cw=D.chatWorldbook[i];if(cw.enabled&&cw.position==='before'&&(!cw.keywords||sT(cw.keywords,chat)))bP.push('['+cw.name+']\n'+cw.content)}if(bP.length)msgs.push({role:'system',content:bP.join('\n\n')});if(ct.persona)msgs.push({role:'system',content:'[角色设定]\n'+ct.persona});var mP=[];for(var i=0;i<wb.length;i++){if(wb[i].enabled&&wb[i].position==='middle'&&(!wb[i].keywords||sT(wb[i].keywords,chat)))mP.push('['+wb[i].name+']\n'+wb[i].content)}for(var i=0;i<D.chatWorldbook.length;i++){var cw=D.chatWorldbook[i];if(cw.enabled&&cw.position==='middle'&&(!cw.keywords||sT(cw.keywords,chat)))mP.push('['+cw.name+']\n'+cw.content)}if(mP.length)msgs.push({role:'system',content:mP.join('\n\n')});var mask=getMask(chat.maskId)||getDefaultMask();var userS=ct.userSetting||(mask?mask.content:'')||D.chatUserSetting||'';if(userS)msgs.push({role:'system',content:'[User设定]\n'+userS});var aP=[];for(var i=0;i<wb.length;i++){if(wb[i].enabled&&wb[i].position==='after'&&(!wb[i].keywords||sT(wb[i].keywords,chat)))aP.push('['+wb[i].name+']\n'+wb[i].content)}for(var i=0;i<D.chatWorldbook.length;i++){var cw=D.chatWorldbook[i];if(cw.enabled&&cw.position==='after'&&(!cw.keywords||sT(cw.keywords,chat)))aP.push('['+cw.name+']\n'+cw.content)}if(aP.length)msgs.push({role:'system',content:aP.join('\n\n')});msgs.push({role:'system',content:'再次提醒：现在是线上文字聊天，分条发短消息，每条一行，不写任何动作神态旁白。'});return msgs}
function sT(kw,chat){if(!kw)return true;var ks=kw.split(',').map(function(s){return s.trim()}).filter(Boolean);if(!ks.length)return true;var r='';var m=chat.messages||[];var s=Math.max(0,m.length-5);for(var i=s;i<m.length;i++)r+=m[i].content+'';for(var i=0;i<ks.length;i++){if(r.indexOf(ks[i])!==-1)return true}return false}
