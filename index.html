<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="来一口美味蛋挞">
<meta name="theme-color" content="#f2f2f2">
<link rel="apple-touch-icon" href="https://nos.netease.com/ysf/382f5f92aaf1795b289034118b1187c9.jpeg">
<title>来一口美味蛋挞</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#f5f5f7;--bg2:#ececf0;--card:#ffffff;--card2:#fafafa;
--text:#1a1a1c;--t2:#6b6b70;--t3:#a8a8ae;
--border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.05);
--acc:#1c1c1e;--acc-soft:#2c2c2e;
--tag-bg:#ececed;--tag-on:#1c1c1e;
--chat-bg:#ededed;--chat-ai:#ffffff;--chat-user:#95ec69;--chat-user-t:#1a1a1c;
--r:16px;--r-sm:11px;
--sh-sm:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.03);
--sh-md:0 2px 8px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
--sh-lg:0 8px 30px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.05);
--font:'SF Pro Text','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif}
html,body{height:100vh;font-family:var(--font);background:#000;color:var(--text);overflow:hidden;font-weight:400;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center}
.phone{width:100%;max-width:430px;height:100vh;max-height:932px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:460px){.phone{height:93vh;box-shadow:0 30px 90px rgba(0,0,0,.35);border-radius:44px;border:1px solid rgba(255,255,255,.06)}}
@media (display-mode: standalone){.phone{max-width:100%;max-height:100vh;width:100vw;height:100vh;border-radius:0}}

.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);opacity:0;transition:transform .38s cubic-bezier(.32,.72,.32,1),opacity .25s;background:var(--bg);z-index:10}
.screen.active{transform:translateX(0);opacity:1}
.screen.home{transform:translateX(0);opacity:1;z-index:1}
.screen::-webkit-scrollbar{width:0}
.home-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.home-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(245,245,247,.2),rgba(245,245,247,.05))}
.home-inner{position:relative;z-index:1;padding:0 26px 20px;min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.clock-area{padding:64px 0 42px;text-align:center}
.clock-time{font-size:74px;font-weight:200;letter-spacing:-4px;line-height:1;color:var(--text)}
.clock-date{font-size:12px;color:var(--t2);margin-top:10px;letter-spacing:1px;font-weight:500}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 12px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;-webkit-user-select:none}
.app-icon{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#ffffff,#f0f0f2);box-shadow:var(--sh-md);border:.5px solid rgba(255,255,255,.8);transition:transform .14s cubic-bezier(.34,1.56,.64,1);position:relative;color:var(--acc)}
.app:active .app-icon{transform:scale(.86)}
.app-name{font-size:10.5px;color:var(--t2);letter-spacing:.2px;font-weight:500}
.badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;background:#ff3b30;border-radius:9px;font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.dock{margin-top:auto;padding:20px 18px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:26px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.4));border-radius:30px;backdrop-filter:blur(10px)}
.dock .app-icon{width:54px;height:54px;border-radius:15px}

.nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(24px) saturate(180%);background:rgba(245,245,247,.82);padding:calc(11px + env(safe-area-inset-top)) 16px 11px;display:flex;align-items:center;gap:10px;border-bottom:.5px solid var(--border)}
.nav-title{font-size:16px;font-weight:600;flex:1;text-align:center;letter-spacing:-.3px}
.back-btn{background:none;border:none;color:var(--acc);font-size:15px;cursor:pointer;font-family:var(--font);font-weight:500;padding:4px 6px;display:flex;align-items:center;gap:2px;min-width:60px}
.nav-right{min-width:60px;display:flex;justify-content:flex-end;gap:6px}
.nav-act{background:none;border:none;color:var(--acc);font-size:14px;cursor:pointer;font-family:var(--font);padding:6px 10px;border-radius:18px;font-weight:500;transition:.15s}
.nav-act:active{opacity:.5}
.nav-act.solid{background:var(--acc);color:#fff;font-weight:500;padding:7px 15px;box-shadow:var(--sh-sm)}
.nav-act.solid:active{transform:scale(.94)}
.content{padding:18px;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.st{font-size:12px;color:var(--t3);letter-spacing:.5px;margin:22px 4px 10px;font-weight:600}
.st:first-child{margin-top:2px}
.hint{font-size:12px;color:var(--t3);line-height:1.7;margin-bottom:14px;padding:0 2px}
.card{background:var(--card);border:.5px solid var(--border2);border-radius:var(--r);padding:15px;margin-bottom:10px;cursor:pointer;transition:transform .12s,box-shadow .2s;box-shadow:var(--sh-sm)}
.card:active{transform:scale(.98);box-shadow:var(--sh-md)}
.card .c-t{font-size:14px;font-weight:600;margin-bottom:4px;letter-spacing:-.2px}
.card .c-b{font-size:12px;color:var(--t2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.card .c-m{font-size:10px;color:var(--t3);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.c-tag{font-size:10px;padding:3px 9px;border-radius:7px;background:var(--tag-bg);color:var(--t2);font-weight:500}
.empty{text-align:center;padding:56px 20px;color:var(--t3);font-size:13px;line-height:2}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--t2);margin-bottom:7px;letter-spacing:.2px;font-weight:600}
.field input,.field textarea,.field select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;font-family:var(--font);font-weight:400;transition:border .2s,box-shadow .2s}
.field textarea{min-height:90px;line-height:1.7;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(28,28,30,.06)}
.field input::placeholder,.field textarea::placeholder{color:#c2c2c8}

.tags-wrap{margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.tag{font-size:12.5px;padding:7px 13px;border-radius:20px;background:var(--card);color:var(--t2);cursor:pointer;transition:all .15s;-webkit-user-select:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);font-weight:500;box-shadow:var(--sh-sm)}
.tag.on{background:var(--tag-on);color:#fff;border-color:var(--tag-on);box-shadow:var(--sh-md)}
.tag:active{transform:scale(.92)}
.tag-x{width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.12);color:var(--t2);font-size:12px;display:inline-flex;align-items:center;justify-content:center;line-height:1;margin-left:1px;font-weight:600}
.tag.on .tag-x{background:rgba(255,255,255,.25);color:#fff}
.custom-tag-input{display:flex;gap:7px;margin-top:2px}
.custom-tag-input input{flex:1;padding:9px 13px;font-size:12.5px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--font)}
.custom-tag-input input:focus{outline:none;border-color:var(--acc)}
.custom-tag-input button{padding:9px 16px;font-size:16px;border-radius:20px;border:none;background:var(--acc);color:#fff;cursor:pointer;font-weight:400;line-height:1}
.custom-tag-input button:active{transform:scale(.92)}

.btn{width:100%;padding:14px;border:none;border-radius:13px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:var(--font);letter-spacing:.2px;transition:transform .12s,box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(160deg,#2c2c2e,#1a1a1c);color:#fff;box-shadow:var(--sh-md)}
.btn.ghost{background:var(--tag-bg);color:var(--text)}
.btn.outline{background:var(--card);border:1px solid var(--border);color:var(--text);box-shadow:var(--sh-sm)}
.btn.danger{background:#fff;border:1px solid rgba(255,59,48,.3);color:#ff3b30;box-shadow:var(--sh-sm)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-row{display:flex;gap:9px;margin-top:10px}
.btn-row .btn{margin:0}
.btn-sm{padding:9px 15px;font-size:12.5px;width:auto;border-radius:11px}

.switch{position:relative;width:44px;height:26px;flex:0 0 44px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#e0e0e3;border-radius:26px;transition:.25s;cursor:pointer}
.slider::before{content:'';position:absolute;width:22px;height:22px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 2px 5px rgba(0,0,0,.18)}
.switch input:checked+.slider{background:#34c759}
.switch input:checked+.slider::before{transform:translateX(18px)}

.si{display:flex;align-items:center;gap:13px;padding:14px 15px;cursor:pointer;background:var(--card);border-bottom:.5px solid var(--border2);transition:background .12s}
.si:active{background:var(--card2)}
.si:first-of-type{border-radius:14px 14px 0 0}
.si:last-of-type{border-radius:0 0 14px 14px;border-bottom:none}
.si-group{margin-bottom:10px;border-radius:14px;overflow:hidden;box-shadow:var(--sh-sm)}
.si-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#3a3a3c,#1c1c1e);flex:0 0 30px;color:#fff}
.si-label{flex:1}
.si-t{font-size:14px;font-weight:500}
.si-s{font-size:11px;color:var(--t3);margin-top:2px}
.si-arr{color:var(--t3);font-size:14px}

.rb{background:var(--card);border:.5px solid var(--border2);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh-sm)}
.rb-h{display:flex;align-items:center;gap:8px;padding:13px 15px;font-size:13px;font-weight:600;border-bottom:.5px solid var(--border2);background:var(--card2)}
.rb textarea{width:100%;border:none;background:transparent;color:var(--text);padding:14px 15px;font-size:13px;line-height:1.75;min-height:180px;font-family:var(--font);font-weight:400;resize:vertical}
.rb textarea:focus{outline:none}

.mm{position:absolute;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);z-index:600;display:none;align-items:flex-end}
.mm.show{display:flex}
.modal{width:100%;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 20px calc(30px + env(safe-area-inset-bottom));max-height:85%;overflow-y:auto;animation:mup .35s cubic-bezier(.32,.72,.32,1);box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.modal::before{content:'';display:block;width:38px;height:5px;background:#d5d5da;border-radius:3px;margin:0 auto 16px}
@keyframes mup{from{transform:translateY(100%)}}
.modal h3{font-size:17px;font-weight:600;margin-bottom:16px;letter-spacing:-.3px}

.lm{position:absolute;inset:0;background:rgba(245,245,247,.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:500;gap:18px}
.lm.show{display:flex}
.spinner{width:34px;height:34px;border:3px solid rgba(0,0,0,.08);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lm p{font-size:13px;color:var(--t2);letter-spacing:.5px;font-weight:500}
.lm-prog{font-size:11px;color:var(--t3);margin-top:-8px}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);background:rgba(28,28,30,.95);backdrop-filter:blur(10px);color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;opacity:0;transition:.28s cubic-bezier(.32,.72,.32,1);z-index:999;pointer-events:none;white-space:nowrap;box-shadow:var(--sh-lg);font-weight:500}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.kw-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.kw-chip{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--tag-bg);color:var(--t2);font-weight:500}
.gen-sec{margin-bottom:18px}
.gen-sec-t{font-size:13px;color:var(--text);margin-bottom:9px;font-weight:600;display:flex;align-items:center;gap:7px}
.gen-sec-t::before{content:'';width:3px;height:13px;background:var(--acc);display:inline-block;border-radius:2px}
.inspire-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:16px;box-shadow:var(--sh-sm)}
.inspire-box textarea{border:none;background:none;width:100%;font-size:14px;color:var(--text);font-family:var(--font);font-weight:400;line-height:1.7;min-height:66px;resize:none}
.inspire-box textarea:focus{outline:none}

.kb-item{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:7px;cursor:pointer;transition:.15s;box-shadow:var(--sh-sm)}
.kb-item.on{border-color:var(--acc);background:var(--acc);color:#fff}
.kb-item.on .kb-name,.kb-item.on .kb-type{color:#fff}
.kb-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);flex:0 0 20px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:.15s;color:transparent}
.kb-item.on .kb-check{background:#fff;border-color:#fff;color:var(--acc)}
.kb-name{font-size:12.5px;flex:1;font-weight:500}
.kb-type{font-size:10px;color:var(--t3)}
.ref-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:7px;cursor:pointer;box-shadow:var(--sh-sm);transition:.15s}
.ref-card.on{border-color:var(--acc);border-width:2px}
.ref-card .rc-t{font-size:12.5px;font-weight:600}
.ref-card .rc-b{font-size:11px;color:var(--t3);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.divider{height:.5px;background:var(--border);margin:18px 0}
.row-2{display:flex;gap:10px}
.row-2>*{flex:1}
.copy-btn{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:6px 12px;font-size:11px;color:var(--t2);cursor:pointer;font-family:var(--font);font-weight:500}
.copy-btn:active{transform:scale(.94)}
.inspire-pick{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:7px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:var(--sh-sm)}
.inspire-pick.on{border-color:var(--acc)}
.inspire-pick .ip-b{font-size:12px;color:var(--t2);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.font-card{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:13px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:var(--sh-sm)}
.font-card.active{border-color:var(--acc);border-width:2px}
.font-card .fc-name{font-size:14px;flex:1;font-weight:500}
.font-card .fc-del{font-size:12px;color:#ff3b30;cursor:pointer;padding:4px 10px}
.continue-btn{align-self:center;margin:10px auto;padding:9px 20px;font-size:12.5px;border-radius:22px;background:var(--card);border:1px solid var(--border);color:var(--t2);cursor:pointer;font-family:var(--font);font-weight:500;box-shadow:var(--sh-sm);display:block}
.continue-btn:active{transform:scale(.95)}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;margin-bottom:16px;overflow-x:auto}
.seg::-webkit-scrollbar{height:0}
.seg-item{flex:1;text-align:center;padding:8px 10px;font-size:12.5px;border-radius:9px;cursor:pointer;color:var(--t2);white-space:nowrap;transition:.18s;font-weight:500}
.seg-item.on{background:var(--card);color:var(--text);box-shadow:var(--sh-sm);font-weight:600}

.export-opt{display:flex;gap:10px;margin:10px 0}
.export-opt .eo{flex:1;padding:16px;border:1.5px solid var(--border);border-radius:14px;text-align:center;cursor:pointer;background:var(--card);transition:.15s}
.export-opt .eo:active{transform:scale(.96)}
.eo-fmt{font-size:16px;font-weight:700;letter-spacing:.5px}
.eo-desc{font-size:10px;color:var(--t3);margin-top:4px}

/* 聊天应用 */
.chat-app{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.chat-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.chat-body::-webkit-scrollbar{width:0}
.chat-bottom-bar{display:flex;align-items:stretch;border-top:.5px solid var(--border);background:rgba(248,248,250,.94);backdrop-filter:blur(24px) saturate(180%);height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);flex:0 0 auto}
.chat-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--t3);transition:.15s}
.chat-bar-item.on{color:#07c160}
.chat-bar-item svg{transition:.15s}
.chat-bar-label{font-size:10px;letter-spacing:.2px;font-weight:500}
.chat-list-header,.contact-header{padding:calc(52px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;background:var(--bg)}
.chat-list-header h1,.contact-header h1{font-size:24px;font-weight:700;flex:1;letter-spacing:-.5px;cursor:pointer}
.chat-list-item,.contact-item{display:flex;align-items:center;gap:13px;padding:12px 18px;cursor:pointer;transition:background .1s;background:var(--card)}
.chat-list-item:active,.contact-item:active{background:#f0f0f2}
.chat-avatar,.contact-avatar{width:50px;height:50px;border-radius:12px;background:linear-gradient(135deg,#d8d8dc,#c0c0c6);display:flex;align-items:center;justify-content:center;flex:0 0 50px;font-size:18px;font-weight:500;color:#fff;letter-spacing:-.5px;overflow:hidden;box-shadow:var(--sh-sm)}
.contact-avatar{width:44px;height:44px;flex:0 0 44px;font-size:16px}
.chat-avatar img,.contact-avatar img{width:100%;height:100%;object-fit:cover}
.chat-info,.contact-info{flex:1;overflow:hidden;border-bottom:.5px solid var(--border2);padding-bottom:12px;min-width:0}
.contact-info{padding:8px 0}
.chat-list-item:last-child .chat-info,.contact-item:last-child .contact-info{border:none}
.chat-name,.contact-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;letter-spacing:-.2px}
.chat-name-time{font-size:11px;color:var(--t3);font-weight:400;margin-left:auto}
.chat-last{font-size:13px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;font-weight:400}
.contact-sub{font-size:11px;color:var(--t3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chat-win{display:flex;flex-direction:column;height:100%;background:var(--chat-bg)}
.chat-win-header{display:flex;align-items:center;gap:11px;padding:calc(11px + env(safe-area-inset-top)) 14px 11px;background:rgba(237,237,237,.94);backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid var(--border);min-height:56px;z-index:5}
.chat-win-back{background:none;border:none;color:var(--acc);font-size:22px;cursor:pointer;padding:0 4px;line-height:1}
.chat-win-info{flex:1;text-align:center;cursor:pointer;min-width:0}
.chat-win-name{font-size:16px;font-weight:600;letter-spacing:-.3px}
.chat-win-status{font-size:10px;color:var(--t3);margin-top:1px}
.chat-win-cfg{background:none;border:none;color:var(--acc);cursor:pointer;padding:4px;display:flex}
.chat-messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:4px;background:var(--chat-bg)}
.chat-messages::-webkit-scrollbar{width:0}
.msg-time{font-size:11px;color:#a0a0a5;align-self:center;padding:10px 0 6px;font-weight:400}
.msg-row{display:flex;align-items:flex-start;gap:8px;max-width:100%;margin-bottom:2px}
.msg-row.user{flex-direction:row-reverse}
.msg-av{width:38px;height:38px;border-radius:9px;flex:0 0 38px;overflow:hidden;background:linear-gradient(135deg,#d8d8dc,#c0c0c6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:500}
.msg-av img{width:100%;height:100%;object-fit:cover}
.msg-bubble{max-width:66%;padding:10px 13px;font-size:14.5px;line-height:1.55;font-weight:400;word-break:break-word;white-space:pre-wrap;position:relative}
.msg-bubble.ai{background:var(--chat-ai);color:var(--text);border-radius:3px 12px 12px 12px;box-shadow:var(--sh-sm)}
.msg-bubble.user{background:var(--chat-user);color:var(--chat-user-t);border-radius:12px 3px 12px 12px}
.msg-sys{align-self:center;font-size:11px;color:#999;background:rgba(0,0,0,.05);padding:4px 12px;border-radius:8px;margin:6px 0}
.typing-row{display:flex;align-items:flex-start;gap:8px}
.typing-indicator{background:var(--chat-ai);border-radius:3px 12px 12px 12px;padding:14px 16px;display:flex;align-items:center;gap:4px;box-shadow:var(--sh-sm)}
.typing-indicator span{width:7px;height:7px;border-radius:50%;background:#c0c0c5;animation:typd .9s infinite alternate}
.typing-indicator span:nth-child(2){animation-delay:.25s}
.typing-indicator span:nth-child(3){animation-delay:.5s}
@keyframes typd{to{opacity:.3;transform:translateY(-4px)}}
.chat-input-area{background:rgba(247,247,247,.96);backdrop-filter:blur(20px);border-top:.5px solid var(--border);padding:9px 12px calc(11px + env(safe-area-inset-bottom))}
.chat-input-row{display:flex;align-items:flex-end;gap:9px}
.chat-input-row textarea{flex:1;background:#fff;border:1px solid var(--border);border-radius:20px;padding:10px 16px;font-size:14.5px;font-family:var(--font);font-weight:400;color:var(--text);resize:none;max-height:110px;line-height:1.5;transition:border .2s}
.chat-input-row textarea:focus{outline:none;border-color:#c5c5ca}
.chat-input-row textarea::placeholder{color:#c2c2c8}
.chat-send-btn{width:38px;height:38px;border-radius:50%;background:#07c160;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 38px;transition:all .15s}
.chat-send-btn:active{transform:scale(.86)}
.chat-send-btn:disabled{background:#c8c8cc}

.wb-entry{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh-sm)}
.wb-entry .wb-t{font-size:13px;font-weight:600;margin-bottom:3px}
.wb-entry .wb-pos{font-size:10px;color:var(--t3)}
.wb-entry-on{border-left:3px solid #07c160}
.api-preset{display:flex;align-items:center;gap:9px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:7px;cursor:pointer;box-shadow:var(--sh-sm)}
.api-preset.on{border-color:var(--acc)}
.api-preset .ap-name{font-size:13px;flex:1;font-weight:600}
.api-preset .ap-info{font-size:10px;color:var(--t3)}
.api-preset .ap-del{font-size:16px;color:#ff3b30;padding:2px 8px;cursor:pointer}

.mask-namecard{background:linear-gradient(135deg,#2c2c2e,#1a1a1c);color:#fff;border-radius:20px;padding:24px 22px;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:var(--sh-lg)}
.mask-namecard::after{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);border-radius:50%}
.mask-namecard .mnc-top{display:flex;align-items:center;gap:15px;position:relative;z-index:1}
.mask-namecard .mnc-av{width:60px;height:60px;border-radius:16px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex:0 0 60px;cursor:pointer;border:1px solid rgba(255,255,255,.15)}
.mask-namecard .mnc-av img{width:100%;height:100%;object-fit:cover}
.mask-namecard .mnc-name{font-size:21px;font-weight:600;letter-spacing:.3px}
.mask-namecard .mnc-sub{font-size:11px;opacity:.55;margin-top:4px}
.mask-namecard .mnc-body{font-size:12px;line-height:1.75;opacity:.8;margin-top:18px;max-height:130px;overflow-y:auto;white-space:pre-wrap;position:relative;z-index:1}
.mask-namecard .mnc-body::-webkit-scrollbar{width:0}
.mask-switch-row{display:flex;gap:12px;overflow-x:auto;padding:2px 0 12px;margin-bottom:14px}
.mask-switch-row::-webkit-scrollbar{height:0}
.mask-mini{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;opacity:.45;transition:.18s}
.mask-mini.on{opacity:1}
.mask-mini-av{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,#d8d8dc,#c0c0c6);display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;overflow:hidden}
.mask-mini-av img{width:100%;height:100%;object-fit:cover}
.mask-mini.on .mask-mini-av{box-shadow:0 0 0 2.5px var(--acc)}
.mask-mini-name{font-size:10px;color:var(--t2);max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.mask-add-mini{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;width:48px}
.mask-add-mini .maa{width:48px;height:48px;border-radius:13px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--t3)}
.mask-card{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:7px;cursor:pointer;box-shadow:var(--sh-sm)}

.mask-card .mask-name{font-size:13px;font-weight:500;flex:1}

function exportTxt(n,t){var b=new Blob([t],{type:'text/plain;charset=utf-8'});dl(b,(n||'export')+'.txt');toast('已导出 TXT')}
function crc32(bytes){var t=crc32.t;if(!t){t=crc32.t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}var crc=0xFFFFFFFF;for(var i=0;i<bytes.length;i++)crc=(crc>>>8)^t[(crc^bytes[i])&0xFF];return(crc^0xFFFFFFFF)>>>0}
function strBytes(s){return new TextEncoder().encode(s)}
function zipStore(files){
  var parts=[],central=[],offset=0;
  function u16(n){return[n&255,(n>>8)&255]}
  function u32(n){return[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255]}
  files.forEach(function(f){
    var name=strBytes(f.name),data=f.data,crc=crc32(data);
    var lh=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
    var lhb=new Uint8Array(lh);parts.push(lhb,name,data);
    var ch=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    central.push({head:new Uint8Array(ch),name:name});
    offset+=lhb.length+name.length+data.length;
  });
  var cStart=offset,cSize=0,cParts=[];
  central.forEach(function(c){cParts.push(c.head,c.name);cSize+=c.head.length+c.name.length});
  var end=[].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cSize),u32(cStart),u16(0));
  var all=parts.concat(cParts,[new Uint8Array(end)]);
  var total=all.reduce(function(a,b){return a+b.length},0);
  var out=new Uint8Array(total),p=0;
  all.forEach(function(a){out.set(a,p);p+=a.length});
  return out;
}
function xmlEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function exportDocx(n,text){
  var paras=String(text).split(/\n/).map(function(line){
    return '<w:p><w:pPr><w:spacing w:after="120" w:line="300" w:lineRule="auto"/></w:pPr><w:r><w:rPr><w:sz w:val="22"/><w:rFonts w:ascii="Calibri" w:eastAsia="Microsoft YaHei"/></w:rPr><w:t xml:space="preserve">'+xmlEsc(line)+'</w:t></w:r></w:p>';
  }).join('');
  var doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+paras+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body></w:document>';
  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  var rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  var zip=zipStore([{name:'[Content_Types].xml',data:strBytes(ct)},{name:'_rels/.rels',data:strBytes(rels)},{name:'word/document.xml',data:strBytes(doc)}]);
  dl(new Blob([zip],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),(n||'export')+'.docx');
  toast('已导出 DOCX');

function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}

function TagPicker(type,gk,sel){this.type=type;this.gk=gk;this.sel=sel;this.el=document.createElement('div');this.el.className='tags-wrap';this._bind();this.render()}
TagPicker.prototype._all=function(){var b=(TAGS[this.type]&&TAGS[this.type][this.gk])||[];var ck=this.type+'_'+this.gk;var c=D.customTags[ck]||[];return{builtIn:b,custom:c,all:b.concat(c)}};
TagPicker.prototype.render=function(){var data=this._all();var sel=this.sel[this.gk]||[];var h='<div class="tags">';for(var i=0;i<data.all.length;i++){var t=data.all[i];var isOn=sel.indexOf(t)!==-1;var isCust=i>=data.builtIn.length;h+='<span class="tag'+(isOn?' on':'')+'" data-toggle="'+esc(t)+'">'+esc(t);if(isCust)h+='<span class="tag-x" data-del="'+esc(t)+'">×</span>';h+='</span>'}h+='</div><div class="custom-tag-input"><input placeholder="添加自定义标签" data-ci="1"><button data-add="1">+</button></div>';this.el.innerHTML=h};
TagPicker.prototype._bind=function(){var self=this;this.el.addEventListener('click',function(e){var del=e.target.closest('[data-del]');if(del){e.stopPropagation();var v=del.getAttribute('data-del');var ck=self.type+'_'+self.gk;D.customTags[ck]=(D.customTags[ck]||[]).filter(function(x){return x!==v});self.sel[self.gk]=(self.sel[self.gk]||[]).filter(function(x){return x!==v});save();self.render();return}var tag=e.target.closest('[data-toggle]');if(tag){var v=tag.getAttribute('data-toggle');if(!self.sel[self.gk])self.sel[self.gk]=[];var idx=self.sel[self.gk].indexOf(v);if(idx!==-1){self.sel[self.gk].splice(idx,1);tag.classList.remove('on')}else{self.sel[self.gk].push(v);tag.classList.add('on')}return}if(e.target.closest('[data-add]')){var inp=self.el.querySelector('[data-ci]');var v=inp.value.trim();if(!v)return;var ck=self.type+'_'+self.gk;var data=self._all();if(data.all.indexOf(v)===-1){if(!D.customTags[ck])D.customTags[ck]=[];D.customTags[ck].push(v);save()}if(!self.sel[self.gk])self.sel[self.gk]=[];if(self.sel[self.gk].indexOf(v)===-1)self.sel[self.gk].push(v);inp.value='';self.render()}});this.el.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.getAttribute('data-ci')){e.preventDefault();self.el.querySelector('[data-add]').click()}})};

function collectTags(st){var p=[];for(var k in st){if(st[k]&&st[k].length)p.push((TAG_NAMES[k]||k)+'：'+st[k].join('、'))}return p.join('\n')||'（未选择）'}

'worldview','worldbook','persona','user'].filter(function(id){return active.some(function(t){return t.id===id})});var results={};var wvText='',personaText='';var nm={worldview:'世界观',worldbook:'世界书',persona:'角色设定',user:'User设定'};showLd('准备中');
function step(idx){
  if(idx>=order.length){hideLd();showBatchResult(input,results,nm);return}

  var tpl;
  if(tid==='worldview'){tpl=getT('worldview').replace('{input}',input).replace('{tags}','（一键生成模式，自由发挥）').replace('{knowledge}',kb||'')}
  else if(tid==='worldbook'){tpl=getT('worldbook').replace('{input}',input).replace('{tags}','（一键生成模式）').replace('{knowledge}',kb||'').replace('{ref}',personaText||input).replace('{world}',wvText||'（无）')}
  else if(tid==='persona'){tpl=getT('persona').replace('{input}',input).replace('{tags}','（一键生成模式）').replace('{knowledge}',kb||'').replace('{world}',wvText||'（无）')}
  else{tpl=getT('user').replace('{input}',input).replace('{tags}','（一键生成模式）').replace('{knowledge}',kb||'').replace('{ref}',personaText||'（无）').replace('{manual}','（无）')}
  callLLM([{role:'system',content:getP(tid)},{role:'user',content:tpl}]).then(function(out){results[tid]=out;if(tid==='worldview')wvText=out;if(tid==='persona')personaText=out;setTimeout(function(){step(idx+1)},300)}).catch(function(e){hideLd();toast(nm[tid]+'生成失败：'+e.message)})
}
// 若选了世界书但没选角色，需要先有角色文本才能围绕角色写——调整顺序：角色先于世界书
if(order.indexOf('worldbook')!==-1&&order.indexOf('persona')!==-1){order=order.filter(function(x){return x!=='worldbook'&&x!=='persona'});var base=['worldview'].filter(function(x){return active.some(function(t){return t.id===x})});order=base.concat(['persona','worldbook'],order.filter(function(x){return x!=='worldview'}));order=order.filter(function(x,i){return order.indexOf(x)===i})}
step(0)}})}

function openStorage(){var view='all';openScreen(function(el){render();function render(){el.innerHTML=navHTML('存储');var bd=document.createElement('div');bd.className='content';var tabs=['全部','角色分组','人设','User','世界观','世界书','灵感'];var tabIds=['all','grouped','persona','user','worldview','worldbook','inspire'];var th='<div class="seg">';for(var i=0;i<tabs.length;i++){th+='<div class="seg-item'+(view===tabIds[i]?' on':'')+'" data-v="'+tabIds[i]+'">'+tabs[i]+'</div>'}th+='</div><div id="sList"></div>';bd.innerHTML=th;el.appendChild(bd);bd.querySelector('.seg').onclick=function(e){var t=e.target.closest('.seg-item');if(t){view=t.getAttribute('data-v');render()}};var list=bd.querySelector('#sList');var nameMap={persona:'人设',user:'User设定',worldview:'世界观',worldbook:'世界书',inspire:'灵感库'};if(!D.storage.length){list.innerHTML='<div class="empty">还没有内容<br>去生成一些吧</div>';return}if(view==='grouped'){var groups={};var ung=[];for(var i=0;i<D.storage.length;i++){var s=D.storage[i];if(s.group){if(!groups[s.group])groups[s.group]=[];groups[s.group].push(s)}else ung.push(s)}var h='';for(var name in groups){var items=groups[name];h+='<div style="display:flex;align-items:center;gap:8px;margin:16px 2px 8px"><div style="font-size:14px;font-weight:600;flex:1">'+esc(name)+' ('+items.length+')</div><button class="btn-sm btn ghost" data-import-group="'+esc(name)+'">导入聊天</button></div>';for(var i=items.length-1;i>=0;i--)h+=cardH(items[i],nameMap)}if(ung.length){h+='<div class="st">未分组 ('+ung.length+')</div>';for(var i=ung.length-1;i>=0;i--)h+=cardH(ung[i],nameMap)}list.innerHTML=h}else{var filtered=view==='all'?D.storage:D.storage.filter(function(s){return s.type===view});if(!filtered.length){list.innerHTML='<div class="empty">该分类暂无内容</div>';return}var h='';if(view==='all'){var byT={};for(var i=0;i<filtered.length;i++){var s=filtered[i];if(!byT[s.type])byT[s.type]=[];byT[s.type].push(s)}for(var t in byT){h+='<div class="st">'+(nameMap[t]||t)+' ('+byT[t].length+')</div>';for(var i=byT[t].length-1;i> function openWallpaperPage(){openScreen(function(el){el.innerHTML=navHTML('壁纸');var bd=document.createElement('div');bd.className='content';bd.innerHTML='<div class="hint">上传图片保存到本地，或输入URL。刷新不丢失。</div><div class="field"><label>图片URL</label><input id="wpUrl" value="'+esc(D.wallpaperUrl||'')+'" placeholder="https://..."></div><div class="btn-row"><button class="btn primary" id="wpApplyUrl">应用URL</button><button class="btn ghost" id="wpUpload">上传图片</button></div><input type="file" id="wpFile" accept="image/*" style="display:none"><div id="wpStatus" style="font-size:11px;color:var(--t3);margin-top:12px">'+(D.wallpaper==='indexeddb'?'当前：已上传图片':D.wallpaperUrl?'当前：URL壁纸':'当前：无壁纸')+'</div><div class="divider"></div><button class="btn outline" id="wpClear">清除壁纸</button>';el.appendChild(bd);bd.querySelector('#wpApplyUrl').onclick=function(){var url=bd.querySelector('#wpUrl').value.trim();if(!url)return toast('请输入URL');D.wallpaperUrl=url;D.wallpaper='';clearWpFromDB();save();applyWallpaper();bd.querySelector('#wpStatus').textContent='当前：URL壁纸';toast('已应用')};bd.querySelector('#wpUpload').onclick=function(){bd.querySelector('#wpFile').click()};bd.querySelector('#wpFile').onchange=function(e){var f=e.target.files[0];if(!f)return;var img=new Image();img.onload=function(){var maxW=1200;var w=img.width;var h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);canvas.toBlob(function(blob){saveWpToDB(blob,function(){D.wallpaper='indexeddb';D.wallpaperUrl='';save();applyWallpaper();bd.querySelector('#wpStatus').textContent='当前：已上传图片';toast('已保存')})},'image/jpeg',0.85)};img.src=URL.createObjectURL(f)};bd.querySelector('#wpClear').onclick=function(){D.wallpaper='';D.wallpaperUrl='';save();clearWpFromDB();applyWallpaper();bd.querySelector('#wpStatus').textContent='当前：无壁纸';toast('已清除')}})}
function openFontPresets(){openScreen(function(el){var pendingBlob=null;var pendingName='';render();function render(){el.innerHTML=navHTML('字体预设');var bd=document.createElement('div');bd.className='content';var h='<div class="hint">上传字体文件(.ttf .otf .woff .woff2)保存为预设。</div>';h+='<div class="font-card'+(D.activeFont?'':' active')+'" data-fn=""><div class="fc-name">默认字体</div></div>';for(var i=0;i<D.fontPresets.length;i++){var f=D.fontPresets[i];h+='<div class="font-card'+(D.activeFont===f.name?' active':'')+'" data-fn="'+esc(f.name)+'"><div class="fc-name">'+esc(f.name)+'</div><div class="fc-del" data-fdel="'+esc(f.name)+'">删除</div></div>'}h+='<div class="divider"></div><div class="field"><label>字体URL（可选）</label><input id="ftUrl" placeholder="https://...font.woff2"></div><div class="field"><label>字体名称</label><input id="ftN" value="'+esc(pendingName)+'" placeholder="给字体起个名字"></div><div class="btn-row"><button class="btn ghost" id="ftU">上传文件</button><button class="btn primary" id="ftSv">保存预设</button></div><input type="file" id="ftF" accept=".ttf,.otf,.woff,.woff2" style="display:none">';bd.innerHTML=h;el.appendChild(bd);bd.onclick=function(e){var del=e.target.closest('[data-fdel]');if(del){e.stopPropagation();var name=del.getAttribute('data-fdel');D.fontPresets=D.fontPresets.filter(function(f){return f.name!==name});if(D.activeFont===name){D.activeFont='';applyFont()}deleteFontFromDB(name);save();render();toast('已删除');return}var card=e.target.closest('.font-card');if(card){var fn=card.getAttribute('data-fn');D.activeFont=fn;save();applyFont();render();toast(fn?'已切换：'+fn:'已切换默认');return}};bd.querySelector('#ftU').onclick=function(){bd.querySelector('#ftF').click()};bd.querySelector('#ftF').onchange=function(e){var f=e.target.files[0];if(!f)return;pendingName=f.name.replace(/\.[^.]+$/,'');bd.querySelector('#ftN').value=pendingName;pendingBlob=f;toast('已加载：'+pendingName)};bd.querySelector('#ftSv').onclick=function(){var name=bd.querySelector('#ftN').value.trim();var url=bd.querySelector('#ftUrl').value.trim();if(!name)return toast('请输入字体名称');if(D.fontPresets.some(function(x){return x.name===name}))return toast('同名预设已存在');if(url){D.fontPresets.push({name:name,url:url});D.activeFont=name;save();applyFont();render();toast('已保存并应用')}else if(pendingBlob){saveFontToDB(name,pendingBlob,function(){D.fontPresets.push({name:name});D.activeFont=name;save();_fontURLCache[name]=URL.createObjectURL(pendingBlob);applyFont();render();toast('已保存并应用');pendingBlob=null;pendingName=''})}else{toast('请上传文件或输入URL')}}}})}

function openApiConfig(){openScreen(function(el){var c=D.api;el.innerHTML=navHTML('API 配置');var bd=document.createElement('div');bd.className='content';var h='<div class="hint">支持 OpenAI 兼容接口。</div>';h+='<div class="field"><label>Base URL</label><input id="au" value="'+esc(c.baseUrl)+'"></div>';h+='<div class="field"><label>API Key</label><input id="ak" type="password" value="'+esc(c.apiKey)+'" placeholder="sk-..."></div>';h+='<div class="field"><label>Model</label><div style="display:flex;gap:6px"><input id="am" value="'+esc(c.model)+'" style="flex:1"><button class="btn-sm btn ghost" id="fetchM">拉取</button></div></div>';h+='<div id="modelList" style="display:none;max-height:200px;overflow-y:auto;margin:-8px 0 14px"></div>';h+='<div class="field"><label>Temperature：<span id="tv">'+c.temperature+'</span></label><input id="at" type="range" min="0" max="2" step="0.1" value="'+c.temperature+'" style="accent-color:var(--acc)"></div>';h+='<div class="field"><label>最大输出长度</label><input id="amx" type="number" value="'+(c.maxTokens||8000)+'"></div>';h+='<div class="btn-row"><button class="btn primary" id="apiSv">保存</button><button class="btn ghost" id="apiTest">测试</button></div><div class="btn-row"><button class="btn outline" id="apiSavePreset">存为预设</button></div>';if(D.apiPresets&&D.apiPresets.length){h+='<div class="st">预设</div>';for(var i=0;i<D.apiPresets.length;i++){var p=D.apiPresets[i];h+='<div class="api-preset" data-api="'+i+'"><div class="ap-name">'+esc(p.name)+'</div><div class="ap-info">'+esc(p.model)+'</div><div class="ap-del" data-apidel="'+i+'">×</div></div>'}}bd.innerHTML=h;el.appendChild(bd);bd.querySelector('#at').oninput=function(e){bd.querySelector('#tv').textContent=e.target.value};bd.querySelector('#fetchM').onclick=function(){var url=bd.querySelector('#au').value.trim().replace(/\/$/,'');var key=bd.querySelector('#ak').value.trim();if(!url||!key)return toast('请先填写URL和Key');toast('拉取中...');fetchModels(url,key,function(err,names){if(err)return toast('拉取失败 piKey;D.api.model=p.model;D.api.temperature=p.temperature;save();back();openApiConfig();toast('已加载：'+p.name)}}})}

  function renderChatList(p){var h='<div class="chat-list-header"><h1 onclick="back()">聊天</h1><button class="nav-act solid" id="nc">+</button></div>';if(!D.chats.length){h+='<div class="empty" style="padding-top:60px">还没有聊天<br>从存储导入角色或新建</div>'}else{for(var i=D.chats.length-1;i>=0;i--){var c=D.chats[i];var ct=null;for(var j=0;j<D.chatContacts.length;j++){if(D.chatContacts[j].id===c.contactId){ct=D.chatContacts[j];break}}var av=ct&&ct.avatar;h+='<div class="chat-list-item" data-cid="'+c.id+'">'+avatarHTML(av,50,(c.name||'?')[0])+'<div class="chat-info"><div class="chat-name">'+esc(c.name)+'<span class="chat-name-time">'+fdt(c.lastTime)+'</span></div><div class="chat-last">'+esc(c.lastMsg||'开始聊天吧')+'</div></div></div>'}}p.innerHTML=h;p.querySelector('#nc').onclick=function(){if(!D.chatContacts.length)return toast('请先导入或新建联系人');var mh='<h3>选择联系人</h3>';for(var i=0;i<D.chatContacts.length;i++){var ct=D.chatContacts[i];mh+='<div class="contact-item" style="background:none;padding:8px 0" data-ncc="'+ct.id+'">'+avatarHTML(ct.avatar,44,(ct.name||'?')[0],'contact-avatar')+'<div class="contact-info" style="border:none;padding:0"><div class="contact-name">'+esc(ct.name)+'</div></div></div>'}mh+='<button class="btn ghost" onclick="closeModal()" style="margin-top:8px">取消</button>';showModal(mh);$('mb').onclick=function(e){var c=e.target.closest('[data-ncc]');if(!c)return;var cid=c.getAttribute('data-ncc');var ct=D.chatContacts.filter(function(x){return x.id===cid})[0];if(!ct)return;var ex=D.chats.filter(function(x){return x.contactId===cid})[0];if(ex){closeModal();openCW(ex.id,render);return}var nc={id:uid(),contactId:cid,name:ct.name,messages:[],created:Date.now(),lastMsg:'',lastTime:Date.now(),maskId:ct.boundMaskId||D.defaultMaskId||''};D.chats.push(nc);save();closeModal();openCW(nc.id,render)}};p.onclick=function(e){var item=e.target.closest('.chat-list-item');if(item)openCW(item.getAttribute('data-cid'),render)}}
  function openCW(chatId,onBack){var chat=D.chats.filter(function(x){return x.id===chatId})[0];if(!chat)return toast('聊天不存在');var ct=D.chatContacts.filter(function(x){return x.id===chat.contactId})[0];var sending=false;openScreen(function(el){el.style.overflow='hidden';var mask=getMask(chat.maskId)||getDefaultMask();var ctAv=ct&&ct.avatar;var maskAv=mask&&mask.avatar;el.innerHTML='<div class="chat-win"><div class="chat-win-header"><button class="chat-win-back" onclick="back()">‹</button><div class="chat-win-info" id="cwHdr"><div class="chat-win-name">'+esc(chat.name)+'</div><div class="chat-win-status">'+(mask?'我：'+esc(mask.name):'未选面具')+'</div></div><button class="chat-win-cfg" id="cwCfg">'+IC16.tpl+'</button></div><div class="chat-messages" id="cwM"></div><div class="chat-input-area"><div class="chat-input-row"><textarea id="cwI" rows="1" placeholder="输入消息..."></textarea><button class="chat-send-btn" id="cwS">'+IC16.send+'</button></div></div></div>';var msgsEl=el.querySelector('#cwM'),inp=el.querySelector('#cwI'),sendBtn=el.querySelector('#cwS');

  function openCC(chat,ct,onDone){openScreen(function(el){el.innerHTML=navHTML('聊天设定');var bd=document.createElement('div');bd.className='content';var h='<div class="st">角色头像</div><div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">'+avatarHTML(ct&&ct.avatar,56,(chat.name||'?')[0])+'<button class="btn-sm btn ghost" id="ccAv">更换头像</button></div>';h+='<div class="st">当前使用面具</div>';if(D.userMasks.length){for(var i=0;i<D.userMasks.length;i++){var mk=D.userMasks[i];h+='<div class="mask-card'+(chat.maskId===mk.id?' on':'')+'" data-mid="'+mk.id+'">'+avatarHTML(mk.avatar,36,(mk.name||'?')[0],'contact-avatar')+'<div class="mask-name">'+esc(mk.name)+'</div></div>'}}else{h+='<div class="hint">暂无面具，请在面具页创建</div>'}h+='<div class="st">角色设定</div><div class="field"><textarea id="ccP" style="min-height:130px">'+esc(ct?ct.persona:'')+'</textarea></div>';h+='<div class="st">角色世界书</div><div id="ccWb">';var wb=ct?ct.worldbook:[];for(var i=0;i<wb.length;i++){var w=wb[i];var pn=w.position==='before'?'前段':w.position==='after'?'后段':'中段';h+='<div class="wb-entry'+(w.enabled?' wb-entry-on':'')+'" data-wbi="'+i+'"><div class="wb-t">'+esc(w.name)+'</div><div class="wb-pos">'+pn+(w.keywords?' · '+esc(w.keywords):'')+'</div></div>'}h+='</div><button class="btn outline btn-sm" id="ccAW" style="margin-top:6px">+ 新建条目</button>';h+='<div class="divider"></div><button class="btn primary" id="ccSv">保存设定</button><div class="btn-row"><button class="btn ghost" id="ccCl">清空记录</button><button class="btn danger" id="ccDl">删除聊天</button></div>';bd.innerHTML=h;el.appendChild(bd);bd.querySelector('#ccAv').onclick=function(){pickAvatar(function(src){if(ct){ct.avatar=src;save();toast('头像已更新');back();if(onDone)onDone()}})};var masks=bd.querySelectorAll('.mask-card');for(var i=0;i<masks.length;i++){(function(m){m.onclick=function(){for(var j=0;j<masks.length;j++)masks[j].classList.remove('on');m.classList.add('on');chat.maskId=m.getAttribute('data-mid');save();toast('已切换面具')}})(masks[i])}bd.query   function editMask(mk,onDone){if(!mk)return;openScreen(function(el){el.innerHTML=navHTML('编辑面具');var bd=document.createElement('div');bd.className='content';bd.innerHTML='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'+avatarHTML(mk.avatar,56,(mk.name||'?')[0])+'<button class="btn-sm btn ghost" id="mkAv">更换头像</button></div><div class="field"><label>名称</label><input id="mkN" value="'+esc(mk.name)+'"></div><div class="field"><label>面具设定</label><textarea id="mkC" style="min-height:220px">'+esc(mk.content)+'</textarea></div><button class="btn primary" id="mkSv">保存</button>';el.appendChild(bd);bd.querySelector('#mkAv').onclick=function(){pickAvatar(function(src){mk.avatar=src;save();toast('头像已更新');back();if(onDone)onDone()})};bd.querySelector('#mkSv').onclick=function(){mk.name=bd.querySelector('#mkN').value.trim();mk.content=bd.querySelector('#mkC').value;save();toast('已保存');back();if(onDone)onDone()}})}

function editCWE(arr,idx,onDone){var item=arr[idx];if(!item)return;showModal('<h3>编辑世界书条目</h3><div class="field"><label>名称</label><input id="ewn" value="'+esc(item.name)+'"></div><div class="field"><label>注入位置</label><select id="ewp"><option value="before"'+(item.position==='before'?' selected':'')+'>前段（常驻背景）</option><option value="middle"'+(item.position==='middle'?' selected':'')+'>中段（关键词触发）</option><option value="after"'+(item.position==='after'?' selected':'')+'>后段（输出前红线）</option></select></div><div class="field"><label>触发关键词（逗号分隔，留空=常驻）</label><input id="ewk" value="'+esc(item.keywords||'')+'"></div><div class="field"><label>内容</label><textarea id="ewc" style="min-height:120px">'+esc(item.content)+'</textarea></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span style="font-size:13px;font-weight:500">启用</span><label class="switch"><input type="checkbox" id="ewe" '+(item.enabled?'checked':'')+'><span class="slider"></span></label></div><div class="btn-row"><button class="btn primary" id="ewS">保存</button><button class="btn danger" id="ewD">删除</button></div>');$('ewS').onclick=function(){item.name=$('ewn').value.trim();item.position=$('ewp').value;item.keywords=$('ewk').value.trim();item.content=$('ewc').value;item.enabled=$('ewe').checked;save();closeModal();if(onDone)onDone()};$('ewD').onclick=function(){arr.splice(idx,1);save();closeModal();if(onDone)onDone()}}

/* ===== 聊天上下文构建（含内置聊天提示词 + 世界书三段 + 面具） ===== */
function buildChatMsgs(ct,chat){
  var msgs=[];
  // 1. 聊天系统提示词（真人分行）
  msgs.push({role:'system',content:getChatSys()});
  if(!ct)return msgs;
  // 2. 前段：世界观 + before世界书（角色级 + 全局）
  var bP=[];if(ct.worldview)bP.push('【世界观】\n'+ct.worldview);
  var wb=ct.worldbook||[];
  for(var i=0;i<wb.length;i++){if(wb[i].enabled&&wb[i].position==='before'&&(!wb[i].keywords||sT(wb[i].keywords,chat)))bP.push('['+wb[i].name+']\n'+wb[i].content)}
  for(var i=0;i<D.chatWorldbook.length;i++){var cw=D.chatWorldbook[i];if(cw.enabled&&cw.position==='before'&&(!cw.keywords||sT(cw.keywords,chat)))bP.push('['+cw.name+']\n'+cw.content)}
  if(bP.length)msgs.push({role:'system',content:bP.join('\n\n')});
  // 3. 角色设定
  if(ct.persona)msgs.push({role:'system',content:'【你扮演的角色设定】\n'+ct.persona});
  // 4. 中段：关键词触发
  var mP=[];for(var i=0;i<wb.length;i++){if(wb[i].enabled&&wb[i].position==='middle'&&(!wb[i].keywords||sT(wb[i].keywords,chat)))mP.push('['+wb[i].name+']\n'+wb[i].content)}
  for(var i=0;i<D.chatWorldbook.length;i++){var cw=D.chatWorldbook[i];if(cw.enabled&&cw.position==='middle'&&(!cw.keywords||sT(cw.keywords,chat)))mP.push('['+cw.name+']\n'+cw.content)}
  if(mP.length)msgs.push({role:'system',content:mP.join('\n\n')});
  // 5. User面具
  var mask=getMask(chat.maskId)||getDefaultMask();var userS=(mask?mask.content:'')||ct.userSetting||D.chatUserSetting||'';
  if(userS)msgs.push({role:'system',content:'【与你聊天的对方（User）设定】\n'+userS});
  // 6. 后段：红线
  var aP=[];for(var i=0;i<wb.length;i++){if(wb[i].enabled&&wb[i].position==='after'&&(!wb[i].keywords||sT(wb[i].keywords,chat)))aP.push('['+wb[i].name+']\n'+wb[i].content)}
  for(var i=0;i<D.chatWorldbook.length;i++){var cw=D.chatWorldbook[i];if(cw.enabled&&cw.position==='after'&&(!cw.keywords||sT(cw.keywords,chat)))aP.push('['+cw.name+']\n'+cw.content)}
  if(aP.length)msgs.push({role:'system',content:aP.join('\n\n')});
  // 7. 历史消息
  var hist=chat.messages.map(function(m){return{role:m.role==='ai'?'assistant':'user',content:m.content}});
  msgs=msgs.concat(hist);
  return msgs;
}
function sT(kw,chat){if(!kw)return true;var ks=kw.split(',').map(function(s){return s.trim()}).filter(Boolean);if(!ks.length)return true;var r='';var m=chat.messages||[];var s=Math.max(0,m.length-6);for(var i=s;i<m.length;i++)r+=m[i].content+'';for(var i=0;i<ks.length;i++){if(r.indexOf(ks[i])!==-1)return true}return false}
