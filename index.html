<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="来一口美味蛋挞">
<meta name="theme-color" content="#f2f2f2">
<link rel="apple-touch-icon" href="https://nos.netease.com/ysf/382f5f92aaf1795b289034118b1187c9.jpeg">
<title>来一口美味蛋挞</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f2f2;--card:rgba(255,255,255,.92);--text:#1a1a1a;--t2:#707070;--t3:#adadad;--border:rgba(0,0,0,.06);--acc:#1a1a1a;--tag-bg:rgba(0,0,0,.045);--tag-on:#1a1a1a;--r:14px;--font:'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif}
:root{--sh1:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);--sh2:0 4px 16px rgba(0,0,0,.08);--sh3:0 8px 30px rgba(0,0,0,.1);--acc-soft:rgba(26,26,26,.06);--line:rgba(0,0,0,.05);--chat-bg:#ededed;--bubble-ai:#ffffff;--bubble-u:#1a1a1a}
html,body{height:100vh;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;font-weight:300;font-size:14px;line-height:1.6}
body{display:flex;align-items:center;justify-content:center}
.phone{width:100%;max-width:430px;height:100vh;max-height:932px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:460px){.phone{height:93vh;box-shadow:0 24px 80px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.12);border-radius:40px}}
@media (display-mode: standalone){.phone{max-width:100%;max-height:100vh;width:100vw;height:100vh;border-radius:0}}

.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);opacity:0;transition:transform .38s cubic-bezier(.32,.72,.32,1),opacity .24s;background:var(--bg);z-index:10}
.screen.active{transform:translateX(0);opacity:1}
.screen.home{transform:translateX(0);opacity:1;z-index:1}
.screen::-webkit-scrollbar{width:0}
.home-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.home-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(242,242,242,.1),rgba(242,242,242,.5))}
.home-inner{position:relative;z-index:1;padding:0 28px 20px;min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.clock-area{padding:56px 0 40px;text-align:center}
.clock-time{font-size:72px;font-weight:200;letter-spacing:-3px;line-height:1;text-shadow:0 1px 20px rgba(255,255,255,.5)}
.clock-date{font-size:11px;color:var(--t2);margin-top:10px;letter-spacing:3px}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 14px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;-webkit-user-select:none}
.app-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(155deg,rgba(255,255,255,.96),rgba(255,255,255,.82));backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.7);box-shadow:0 6px 16px rgba(0,0,0,.08),inset 0 1px 1px rgba(255,255,255,.6);transition:transform .16s cubic-bezier(.34,1.56,.64,1);position:relative;color:#1a1a1a}
.app:active .app-icon{transform:scale(.86)}
.app-name{font-size:10.5px;color:var(--t2);letter-spacing:.3px;text-shadow:0 1px 4px rgba(255,255,255,.6)}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;background:#ff3b30;border-radius:8px;font-size:8px;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 2px 5px rgba(255,59,48,.4);font-weight:500}
.dock{margin-top:auto;padding:20px 18px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:24px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.25));border-radius:32px}
.dock .app-icon{width:52px;height:52px;border-radius:15px}

.nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(30px);background:rgba(242,242,242,.85);padding:calc(13px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:.5px solid var(--line)}
.back-btn{background:none;border:none;color:var(--text);font-size:15px;cursor:pointer;font-family:var(--font);font-weight:400;padding:6px 8px 6px 0;display:flex;align-items:center;gap:3px;flex:1;min-width:0}
.back-btn svg{flex:0 0 auto;margin-left:-3px}
.back-btn:active{opacity:.5}
.nav-act{background:none;border:none;color:var(--t2);font-size:12.5px;cursor:pointer;font-family:var(--font);padding:7px 14px;border-radius:20px;transition:all .15s;flex:0 0 auto;white-space:nowrap}
.nav-act:active{transform:scale(.94)}
.nav-act.solid{background:var(--acc);color:#fff;font-weight:400;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.content{padding:18px;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.st{font-size:10px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin:22px 4px 9px;font-weight:500}
.st:first-child{margin-top:2px}
.hint{font-size:11.5px;color:var(--t3);line-height:1.75;margin-bottom:14px;padding:0 2px}
.card{background:var(--card);backdrop-filter:blur(16px);border:.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer;transition:transform .12s,box-shadow .2s;box-shadow:var(--sh1)}
.card:active{transform:scale(.98);box-shadow:var(--sh2)}
.card .c-t{font-size:13.5px;font-weight:500;margin-bottom:4px}
.card .c-b{font-size:11.5px;color:var(--t2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.card .c-m{font-size:9px;color:var(--t3);margin-top:8px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.c-tag{font-size:9px;padding:3px 8px;border-radius:6px;background:var(--tag-bg);color:var(--t2)}
.empty{text-align:center;padding:54px 20px;color:var(--t3);font-size:12px;line-height:1.9}
.field{margin-bottom:15px}
.field label{display:block;font-size:10px;color:var(--t3);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;font-weight:500}
.field input,.field textarea,.field select{width:100%;background:var(--card);border:.5px solid var(--border);border-radius:11px;padding:11px 13px;color:var(--text);font-size:13px;font-family:var(--font);font-weight:300;transition:border .2s,box-shadow .2s;box-shadow:var(--sh1)}
.field textarea{min-height:80px;line-height:1.75;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.field input::placeholder,.field textarea::placeholder{color:#c4c4c4}
.tags-wrap{margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.tag{font-size:11.5px;padding:6px 13px;border-radius:20px;background:var(--card);color:var(--t2);cursor:pointer;transition:all .15s;-webkit-user-select:none;display:inline-flex;align-items:center;gap:5px;border:.5px solid var(--border);box-shadow:var(--sh1)}
.tag.on{background:var(--tag-on);color:#fff;border-color:var(--tag-on);box-shadow:0 3px 10px rgba(0,0,0,.18)}
.tag:active{transform:scale(.92)}
.tag-x{width:15px;height:15px;border-radius:50%;background:rgba(0,0,0,.12);color:var(--t2);font-size:11px;font-weight:400;display:inline-flex;align-items:center;justify-content:center;line-height:1;margin:-1px -3px -1px 1px;transition:.12s}
.tag.on .tag-x{background:rgba(255,255,255,.28);color:#fff}
.tag-x:active{background:#ff3b30;color:#fff;transform:scale(1.15)}
.custom-tag-input{display:flex;gap:6px;margin-top:4px;max-width:220px}
.custom-tag-input input{flex:1;min-width:0;padding:8px 12px;font-size:11.5px;border-radius:10px;border:.5px solid var(--border);background:var(--card);color:var(--text);font-family:var(--font);box-shadow:var(--sh1)}
.custom-tag-input input:focus{outline:none;border-color:var(--acc)}
.custom-tag-input button{flex:0 0 auto;width:38px;padding:8px 0;font-size:15px;border-radius:10px;border:none;background:var(--acc);color:#fff;cursor:pointer;transition:.12s}
.custom-tag-input button:active{transform:scale(.9)}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:13.5px;font-weight:400;cursor:pointer;font-family:var(--font);letter-spacing:.3px;transition:transform .12s,box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#2a2a2a,#1a1a1a);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.btn.primary:active{box-shadow:0 2px 8px rgba(0,0,0,.2)}
.btn.ghost{background:var(--card);color:var(--text);border:.5px solid var(--border);box-shadow:var(--sh1)}
.btn.outline{background:none;border:.5px solid var(--border);color:var(--t2)}
.btn.danger{background:none;border:.5px solid rgba(204,0,0,.4);color:#c00}
.btn.danger:active{background:rgba(204,0,0,.06)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-row{display:flex;gap:9px;margin-top:10px}
.btn-row .btn{margin:0}
.btn-sm{padding:8px 14px;font-size:11.5px;width:auto;border-radius:10px}
.switch{position:relative;width:42px;height:24px;flex:0 0 42px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#d8d8d8;border-radius:24px;transition:.22s;cursor:pointer}
.slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.22s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:var(--acc)}
.switch input:checked+.slider::before{transform:translateX(18px)}
.si{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:.5px solid var(--line);cursor:pointer;transition:.1s}
.si:active{opacity:.6}
.si:last-child{border:none}
.si-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--acc-soft);flex:0 0 32px;color:var(--t2)}
.si-label{flex:1}
.si-t{font-size:13.5px}
.si-s{font-size:10.5px;color:var(--t3);margin-top:2px}
.si-arr{color:var(--t3);font-size:16px}
.rb{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh1)}
.rb-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:12.5px;font-weight:500;border-bottom:.5px solid var(--line);background:var(--acc-soft)}
.rb textarea{width:100%;border:none;background:transparent;color:var(--text);padding:13px 14px;font-size:12.5px;line-height:1.75;min-height:180px;font-family:var(--font);font-weight:300;resize:vertical}
.rb textarea:focus{outline:none}
.mm{position:absolute;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(3px);z-index:600;display:none;align-items:flex-end}
.mm.show{display:flex}
.modal{width:100%;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 18px calc(30px + env(safe-area-inset-bottom));max-height:84%;overflow-y:auto;animation:mup .34s cubic-bezier(.32,.72,.32,1);box-shadow:0 -8px 40px rgba(0,0,0,.15)}
.modal::before{content:'';display:block;width:38px;height:4px;border-radius:3px;background:rgba(0,0,0,.15);margin:8px auto 16px}
@keyframes mup{from{transform:translateY(100%)}}
.modal h3{font-size:15px;font-weight:500;margin-bottom:16px}
.lm{position:absolute;inset:0;background:rgba(242,242,242,.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:500;gap:16px}
.lm.show{display:flex}
.dots{display:flex;gap:5px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:bce .6s infinite alternate}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes bce{to{opacity:.15;transform:translateY(-6px)}}
.lm p{font-size:11px;color:var(--t2);letter-spacing:1.5px}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:rgba(26,26,26,.95);color:#fff;padding:10px 20px;border-radius:22px;font-size:11.5px;opacity:0;transition:.28s;z-index:999;pointer-events:none;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.25);backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kw-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.kw-chip{font-size:9px;padding:3px 7px;border-radius:6px;background:var(--tag-bg);color:var(--t2)}
.gen-sec{margin-bottom:20px}
.gen-sec-t{font-size:12px;color:var(--text);margin-bottom:11px;font-weight:500;display:flex;align-items:center;gap:8px;letter-spacing:.2px}
.gen-sec-t::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--acc);display:inline-block}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:2px}
.inspire-box{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:20px;box-shadow:var(--sh1)}
.inspire-box textarea{border:none;background:none;width:100%;font-size:13.5px;color:var(--text);font-family:var(--font);font-weight:300;line-height:1.75;min-height:64px;resize:none}
.inspire-box textarea:focus{outline:none}
.kb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:.5px solid var(--border);border-radius:11px;margin-bottom:6px;cursor:pointer;transition:.14s;box-shadow:var(--sh1)}
.kb-item.on{border-color:var(--acc);background:var(--tag-on);color:#fff}
.kb-item.on .kb-name,.kb-item.on .kb-type{color:#fff}
.kb-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);flex:0 0 18px;display:flex;align-items:center;justify-content:center;font-size:10px;transition:.14s}
.kb-item.on .kb-check{background:#fff;border-color:#fff;color:var(--acc)}
.kb-name{font-size:11.5px;flex:1}
.kb-type{font-size:9px;color:var(--t3)}
.ref-card{background:var(--card);border:.5px solid var(--border);border-radius:11px;padding:11px;margin-bottom:7px;cursor:pointer;transition:.14s;box-shadow:var(--sh1)}
.ref-card.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.ref-card .rc-t{font-size:11.5px;font-weight:500}
.ref-card .rc-b{font-size:10px;color:var(--t3);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.divider{height:.5px;background:var(--line);margin:18px 0}
.row-2{display:flex;gap:9px}
.row-2>*{flex:1}
.copy-btn{background:var(--card);border:.5px solid var(--border);border-radius:8px;padding:5px 11px;font-size:10.5px;color:var(--t2);cursor:pointer;font-family:var(--font);transition:.12s}
.copy-btn:active{transform:scale(.92)}
.inspire-pick{background:var(--card);border:.5px solid var(--border);border-radius:11px;padding:11px;margin-bottom:7px;cursor:pointer;display:flex;align-items:center;gap:9px;box-shadow:var(--sh1)}
.inspire-pick.on{border-color:var(--acc)}
.inspire-pick .ip-b{font-size:11.5px;color:var(--t2);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.font-card{padding:13px;background:var(--card);border:.5px solid var(--border);border-radius:var(--r);margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:var(--sh1)}
.font-card.active{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.font-card .fc-name{font-size:13.5px;flex:1}
.font-card .fc-del{font-size:11px;color:#c00;cursor:pointer;padding:5px 9px}

/* 聊天应用 */
.chat-app{display:flex;flex-direction:column;height:100%;background:var(--chat-bg)}
.chat-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.chat-body::-webkit-scrollbar{width:0}
.chat-bottom-bar{display:flex;align-items:stretch;border-top:.5px solid var(--border);background:rgba(248,248,248,.94);backdrop-filter:blur(24px);height:calc(54px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);flex:0 0 auto}
.chat-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--t3);transition:.15s}
.chat-bar-item.on{color:var(--text)}
.chat-bar-item svg{opacity:.55;transition:.15s}
.chat-bar-item.on svg{opacity:1}
.chat-bar-label{font-size:9px;letter-spacing:.3px}
.chat-list-header,.contact-header{padding:calc(20px + env(safe-area-inset-top)) 22px 10px;display:flex;align-items:center;gap:10px}
.chat-list-header h1,.contact-header h1{font-size:30px;font-weight:300;flex:1;letter-spacing:-1px;cursor:pointer}
.chl-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);border:.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;box-shadow:var(--sh1);font-size:19px;transition:.14s}
.chl-btn:active{transform:scale(.9)}
.chat-list-item,.contact-item{display:flex;align-items:center;gap:14px;padding:12px 20px;cursor:pointer;transition:background .12s}
.chat-list-item:active,.contact-item:active{background:rgba(0,0,0,.04)}
.chat-avatar,.contact-avatar,.av-wrap{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#e8e8e8,#cfcfcf);display:flex;align-items:center;justify-content:center;flex:0 0 50px;font-size:18px;font-weight:400;color:#8a8a8a;letter-spacing:-1px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.av-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.contact-avatar{width:44px;height:44px;flex:0 0 44px;font-size:16px}
.chat-info,.contact-info{flex:1;overflow:hidden;border-bottom:.5px solid var(--line);padding-bottom:12px;min-width:0}
.contact-info{padding:10px 0}
.chat-list-item:last-child .chat-info,.contact-item:last-child .contact-info{border:none}
.chat-name,.contact-name{font-size:15px;font-weight:400;display:flex;align-items:center;gap:6px}
.chat-name-main{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-name-time{font-size:9.5px;color:var(--t3);font-weight:300;margin-left:auto;flex:0 0 auto}
.chat-last{font-size:12.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;font-weight:300}
.contact-sub{font-size:11px;color:var(--t3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 聊天窗口 */
.chat-win{display:flex;flex-direction:column;height:100%;background:var(--chat-bg)}
.chat-win-header{display:flex;align-items:center;gap:11px;padding:calc(8px + env(safe-area-inset-top)) 14px 10px;background:rgba(248,248,248,.9);backdrop-filter:blur(30px);border-bottom:.5px solid var(--border);min-height:52px;z-index:5}
.cw-back{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:2px 4px;flex:0 0 auto}
.chat-win-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e0e0e0,#c8c8c8);display:flex;align-items:center;justify-content:center;font-size:14px;color:#8a8a8a;overflow:hidden;flex:0 0 36px}
.chat-win-avatar img{width:100%;height:100%;object-fit:cover}
.chat-win-info{flex:1;cursor:pointer;overflow:hidden}
.chat-win-name{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-win-status{font-size:9.5px;color:var(--t3);margin-top:1px}
.chat-win-cfg{background:none;border:none;color:var(--t2);cursor:pointer;padding:6px;font-size:19px;flex:0 0 auto}
.chat-messages{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:2px}
.chat-messages::-webkit-scrollbar{width:0}
.msg-row{display:flex;align-items:flex-end;gap:8px;margin-top:3px;max-width:100%}
.msg-row.u{flex-direction:row-reverse}
.msg-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#e0e0e0,#c8c8c8);display:flex;align-items:center;justify-content:center;font-size:13px;color:#8a8a8a;overflow:hidden;flex:0 0 34px;align-self:flex-start;margin-top:2px}
.msg-av img{width:100%;height:100%;object-fit:cover}
.msg-av.blank{background:none;box-shadow:none}
.msg-col{display:flex;flex-direction:column;max-width:72%;min-width:0}
.msg-row.u .msg-col{align-items:flex-end}

/* ===== 文件导入导出（txt / docx） ===== */
var CRC_T=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){var c=0xFFFFFFFF;for(var i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function u8(s){return new TextEncoder().encode(s)}
function xmlEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function makeStoreZip(files){
  var parts=[],central=[],offset=0;
  function pushLE(arr,v,n){for(var i=0;i<n;i++){arr.push((v>>>(i*8))&0xFF)}}
  for(var f=0;f<files.length;f++){
    var nameU8=u8(files[f].name),data=files[f].data,crc=crc32(data);
    var lh=[];pushLE(lh,0x04034b50,4);pushLE(lh,20,2);pushLE(lh,0,2);pushLE(lh,0,2);pushLE(lh,0,2);pushLE(lh,0,2);pushLE(lh,crc,4);pushLE(lh,data.length,4);pushLE(lh,data.length,4);pushLE(lh,nameU8.length,2);pushLE(lh,0,2);
    var lhU=new Uint8Array(lh);
    parts.push(lhU,nameU8,data);
    var cd=[];pushLE(cd,0x02014b50,4);pushLE(cd,20,2);pushLE(cd,20,2);pushLE(cd,0,2);pushLE(cd,0,2);pushLE(cd,0,2);pushLE(cd,0,2);pushLE(cd,crc,4);pushLE(cd,data.length,4);pushLE(cd,data.length,4);pushLE(cd,nameU8.length,2);pushLE(cd,0,2);pushLE(cd,0,2);pushLE(cd,0,2);pushLE(cd,0,2);pushLE(cd,0,4);pushLE(cd,offset,4);
    central.push(new Uint8Array(cd),nameU8);
    offset+=lhU.length+nameU8.length+data.length;
  }
  var cdStart=offset,cdSize=0;for(var i=0;i<central.length;i++)cdSize+=central[i].length;
  var eocd=[];pushLE(eocd,0x06054b50,4);pushLE(eocd,0,2);pushLE(eocd,0,2);pushLE(eocd,files.length,2);pushLE(eocd,files.length,2);pushLE(eocd,cdSize,4);pushLE(eocd,cdStart,4);pushLE(eocd,0,2);
  var all=parts.concat(central,[new Uint8Array(eocd)]);
  var total=0;for(var i=0;i<all.length;i++)total+=all[i].length;
  var out=new Uint8Array(total),p=0;for(var i=0;i<all.length;i++){out.set(all[i],p);p+=all[i].length}
  return out;
}
function buildDocx(text){
  var paras=String(text||'').split(/\r?\n/).map(function(line){
    if(line==='')return '<w:p/>';
    return '<w:p><w:r><w:t xml:space="preserve">'+xmlEsc(line)+'</w:t></w:r></w:p>';
  }).join('');
  var doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+paras+'<w:sectPr/></w:body></w:document>';
  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  var rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  return makeStoreZip([{name:'[Content_Types].xml',data:u8(ct)},{name:'_rels/.rels',data:u8(rels)},{name:'word/document.xml',data:u8(doc)}]);
}
function download(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function exportPick(name,text){
  name=(name||'export').replace(/[\/\\:*?"<>|]/g,'_').slice(0,40);
  showModal('<h3>选择导出格式</h3><div class="btn-row" style="flex-direction:column"><button class="btn primary" id="exTxt">导出为 .txt</button><button class="btn ghost" id="exDocx" style="margin-top:8px">导出为 .docx</button><button class="btn outline" id="exCancel" style="margin-top:8px">取消</button></div>');
  $('exTxt').onclick=function(){download(new Blob([text],{type:'text/plain;charset=utf-8'}),name+'.txt');closeModal();toast('已导出 txt')};
  $('exDocx').onclick=function(){try{var z=buildDocx(text);download(new Blob([z],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),name+'.docx');closeModal();toast('已导出 docx')}catch(e){toast('导出失败：'+e.message)}};
  $('exCancel').onclick=closeModal;
}
/* docx / txt 导入 —— 用浏览器原生 DecompressionStream 解 zip */
function readFileSmart(file,cb){
  var name=(file.name||'').toLowerCase();
  if(name.endsWith('.docx')){
    file.arrayBuffer().then(function(buf){parseDocx(new Uint8Array(buf),cb)}).catch(function(e){cb('读取失败：'+e.message,null)});
  }else{
    var r=new FileReader();r.onload=function(){cb(null,r.result)};r.onerror=function(){cb('读取失败',null)};r.readAsText(file);
  }
}
function findDocumentXml(zipU8,done){
  var dv=new DataView(zipU8.buffer);
  var eocd=-1;
  for(var i=zipU8.length-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)return done('不是有效的 docx',null);
  var count=dv.getUint16(eocd+10,true),cdOff=dv.getUint32(eocd+16,true);
  var p=cdOff,target=null;
  for(var n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    var method=dv.getUint16(p+10,true),compSize=dv.getUint32(p+20,true),nameLen=dv.getUint16(p+28,true),extraLen=dv.getUint16(p+30,true),cmtLen=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    var nm=new TextDecoder().decode(zipU8.subarray(p+46,p+46+nameLen));
    if(nm==='word/document.xml'){target={method:method,compSize:compSize,lho:lho};break}
    p+=46+nameLen+extraLen+cmtLen;
  }
  if(!target)return done('docx 内未找到正文',null);
  var lhNameLen=dv.getUint16(target.lho+26,true),lhExtraLen=dv.getUint16(target.lho+28,true);
  var dataStart=target.lho+30+lhNameLen+lhExtraLen;
  var comp=zipU8.subarray(dataStart,dataStart+target.compSize);
  if(target.method===0){done(null,new TextDecoder().decode(comp));return}
  if(typeof DecompressionStream==='undefined')return done('浏览器不支持解压 docx，请用 txt',null);
  var ds=new DecompressionStream('deflate-raw');
  new Response(new Blob([comp]).stream().pipeThrough(ds)).arrayBuffer().then(function(ab){done(null,new TextDecoder().decode(new Uint8Array(ab)))}).catch(function(e){done('解压失败：'+e.message,null)});
}
function parseDocx(zipU8,cb){
  findDocumentXml(zipU8,function(err,xml){
    if(err)return cb(err,null);
    var text=xml.replace(/<w:p[ >]/g,'\n<w:p ').replace(/<[^>]+>/g,function(t){return /<w:t[ >]/.test(t)||t==='</w:t>'?'':' '});
    // 更精确提取 w:t 文本，保留段落换行
    var out=[],re=/<w:p\b[^>]*>([\s\S]*?)<\/w:p>/g,m;
    var raw=xml;
    while((m=re.exec(raw))){
      var seg=m[1],tre=/<w:t[^>]*>([\s\S]*?)<\/w:t>/g,tm,line='';
      while((tm=tre.exec(seg)))line+=tm[1];
      out.push(line.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"'));
    }
    cb(null,out.join('\n'));
  });
}

function callLLM(msgs,max){max=max||D.api.maxTokens||32000;var c=D.api;if(!c.apiKey)return Promise.reject(new Error('请先配置API Key'));var all=[];if(D.jailbreak.top)all.push({role:'system',content:D.jailbreak.top});all=all.concat(msgs);if(D.jailbreak.bottom)all.push({role:'system',content:D.jailbreak.bottom});return fetch(c.baseUrl+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.apiKey},body:JSON.stringify({model:c.model,messages:all,temperature:c.temperature,max_tokens:max})}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+t.slice(0,120))});return r.json()}).then(function(d){return(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||'').trim()||'(空)'})}
function buildKB(theme,ids){var items=[];for(var i=0;i<D.knowledge.length;i++){var k=D.knowledge[i];if(!k.enabled||ids.indexOf(k.id)===-1)continue;if(!k.keywords||!k.keywords.length){items.push(k);continue}for(var j=0;j<k.keywords.length;j++){if((theme||'').indexOf(k.keywords[j])!==-1){items.push(k);break}}}if(!items.length)return'';return'\u3010知识库参考\u3011\n'+items.map(function(k){return'['+(k.name||'条目')+']\n'+k.content}).join('\n\n')}
function fetchModels(baseUrl,apiKey,cb){fetch(baseUrl+'/models',{headers:{'Authorization':'Bearer '+apiKey}}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){var list=(d.data||d||[]);if(!Array.isArray(list))list=[];var names=list.map(function(m){return m.id||m.name||''}).filter(Boolean).sort();cb(null,names)}).catch(function(e){cb(e)})}

function pickAvatar(cb){var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=function(){var f=inp.files[0];if(!f)return;var img=new Image();img.onload=function(){var side=Math.min(img.width,img.height);var out=Math.min(side,320);var canvas=document.createElement('canvas');canvas.width=out;canvas.height=out;var ctx=canvas.getContext('2d');var sx=(img.width-side)/2,sy=(img.height-side)/2;ctx.drawImage(img,sx,sy,side,side,0,0,out,out);cb(canvas.toDataURL('image/jpeg',0.85))};img.src=URL.createObjectURL(f)};inp.click()}

/* ===== 标签选择器 ===== */
function TagPicker(type,gk,sel){this.type=type;this.gk=gk;this.sel=sel;this.el=document.createElement('div');this.el.className='tags-wrap';this._bind();this.render()}
TagPicker.prototype._all=function(){var b=(TAGS[this.type]&&TAGS[this.type][this.gk])||[];var ck=this.type+'_'+this.gk;var c=D.customTags[ck]||[];return{builtIn:b,custom:c,all:b.concat(c)}};
TagPicker.prototype.render=function(){var data=this._all();var sel=this.sel[this.gk]||[];var h='<div class="tags">';for(var i=0;i<data.all.length;i++){var t=data.all[i];var on=sel.indexOf(t)!==-1;var cust=i>=data.builtIn.length;h+='<span class="tag'+(on?' on':'')+'" data-act="toggle" data-val="'+esc(t)+'">'+esc(t);if(cust)h+='<span class="tag-x" data-act="del" data-val="'+esc(t)+'">\u00d7</span>';h+='</span>'}h+='</div><div class="custom-tag-input"><input placeholder="自定义标签" data-role="ci"><button data-act="add" type="button">+</button></div>';this.el.innerHTML=h};
TagPicker.prototype._bind=function(){var self=this;this.el.addEventListener('click',function(e){var x=e.target.closest('[data-act="del"]');if(x){e.stopPropagation();var v=x.getAttribute('data-val');var ck=self.type+'_'+self.gk;D.customTags[ck]=(D.customTags[ck]||[]).filter(function(y){return y!==v});self.sel[self.gk]=(self.sel[self.gk]||[]).filter(function(y){return y!==v});save();self.render();return}var add=e.target.closest('[data-act="add"]');if(add){var inp=self.el.querySelector('[data-role="ci"]');var v=inp.value.trim();if(!v)return;var ck=self.type+'_'+self.gk;if(self._all().all.indexOf(v)===-1){if(!D.customTags[ck])D.customTags[ck]=[];D.customTags[ck].push(v);save()}if(!self.sel[self.gk])self.sel[self.gk]=[];if(self.sel[self.gk].indexOf(v)===-1)self.sel[self.gk].push(v);inp.value='';self.render();return}var tag=e.target.closest('.tag[data-act="toggle"]');if(tag){var v=tag.getAttribute('data-val');if(!self.sel[self.gk])self.sel[self.gk]=[];var idx=self.sel[self.gk].indexOf(v);if(idx!==-1){self.sel[self.gk].splice(idx,1);tag.classList.remove('on')}else{self.sel[self.gk].push(v);tag.classList.add('on')}}});this.el.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.getAttribute('data-role')==='ci'){e.preventDefault();self.el.querySelector('[data-act="add"]').click()}})};

function renderKbPicker(c,ids){var list=D.knowledge.filter(function(k){return k.enabled});if(!list.length){c.innerHTML='<div class="hint">知识库为空</div>';return}var h='';for(var i=0;i<list.length;i++){var k=list[i];var on=ids.indexOf(k.id)!==-1;h+='<div class="kb-item'+(on?' on':'')+'" data-kid="'+k.id+'"><div class="kb-check">'+(on?'\u2713':'')+'</div><div class="kb-name">'+esc(k.name||'未命名')+'</div><div class="kb-type">'+(k.keywords&&k.keywords.length?k.keywords.slice(0,3).join(','):'常驻')+'</div></div>'}c.innerHTML=h;c.onclick=function(e){var el=e.target.closest('.kb-item');if(!el)return;var id=el.getAttribute('data-kid');var idx=ids.indexOf(id);if(idx!==-1)ids.splice(idx,1);else ids.push(id);el.classList.toggle('on');el.querySelector('.kb-check').textContent=el.classList.contains('on')?'\u2713':''}}
function renderInspirePicker(c,ids){var list=D.storage.filter(function(s){return s.type==='inspire'});if(!list.length){c.innerHTML='';return}var h='';for(var i=0;i<list.length;i++){var s=list[i];var on=ids.indexOf(s.id)!==-1;h+='<div class="inspire-pick'+(on?' on':'')+'" data-iid="'+s.id+'"><div class="kb-check">'+(on?'\u2713':'')+'</div><div class="ip-b">'+esc((s.content||s.title||'').slice(0,80))+'</div></div>'}c.innerHTML=h;c.onclick=function(e){var el=e.target.closest('.inspire-pick');if(!el)return;var id=el.getAttribute('data-iid');var idx=ids.indexOf(id);if(idx!==-1)ids.splice(idx,1);else ids.push(id);el.classList.toggle('on');el.querySelector('.kb-check').textContent=el.classList.contains('on')?'\u2713':''}}

  for(var i=0;i<gks.length;i++){h+='<div class="gen-sec"><div class="gen-sec-t">'+(TAG_NAMES[gks[i]]||gks[i])+'</div><div id="tg_'+gks[i]+'"></div></div>'}h+='<div class="gen-sec"><div class="gen-sec-t">知识库</div><div id="kbP"></div></div>';h+='<button class="btn primary" id="genBtn">生成'+esc(title)+'</button>';bd.innerHTML=h;el.appendChild(bd);

  bd.querySelector('#genBtn').onclick=function(){var input=bd.querySelector('#g-input').value.trim();var pi=collectInspires(inspireSel);if(pi)input=(input?input+'\n\n':'')+'\u3010导入的灵感\u3011\n'+pi;var allEmpty=true;for(var k in selTags){if(selTags[k]&&selTags[k].length){allEmpty=false;break}}if(!input&&allEmpty&&!refContent)return toast('写点灵感或选几个标签');if(!D.api.apiKey)return toast('请先配置API');var ts=collectTags(selTags);var kb=buildKB(input,kbSel);var tpl=getT(type).replace('{input}',input||'（未填写）').replace('{tags}',ts).replace('{knowledge}',kb||'').replace('{ref}',refContent?('['+refName+']\n'+refContent):'（无）').replace('{manual}','');showLd('生成'+title+'中');LLM([{role:'system',content:getP(type)},{role:'user',content:tpl}]).then(function(out){hideLd();showResult(type,title,input,out,{sys:getP(type),user:tpl})}).catch(function(e){hideLd();toast('失败：'+e.message)})}})}

function openKnowledge(){openScreen(function(el){render();function render(){el.innerHTML=navHTML('知识库','<button class="nav-act solid" id="addBtn">+ 新条目</button>');var bd=document.createElement('div');bd.className='content';var h='<div class="hint">存放生成时参考的世界书条目。填关键词→命中才触发 · 不填→常驻触发</div>';if(!D.knowledge.length){h+='<div class="empty">知识库为空<br>点右上角新建</div>'}else{for(var i=0;i<D.knowledge.length;i++){var k=D.knowledge[i];h+='<div class="card" data-id="'+k.id+'"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><div class="c-t" style="flex:1;margin:0">'+esc(k.name||'未命名')+'</div><label class="switch" onclick="event.stopPropagation()"><input type="checkbox" '+(k.enabled?'checked':'')+' data-tog="'+k.id+'"><span class="slider"></span></label></div><div class="c-b">'+esc(k.content)+'</div><div class="c-m">'+(k.keywords&&k.keywords.length?'<div class="kw-chips">'+k.keywords.map(function(w){return'<span class="kw-chip">'+esc(w)+'</span>'}).join('')+'</div>':'<span class="c-tag">常驻</span>')+'</div></div>'}}bd.innerHTML=h;el.appendChild(bd);el.querySelector('#addBtn').onclick=function(){editKB(null,render)};bd.onclick=function(e){var tog=e.target.closest('[data-tog]');if(tog){var k=D.knowledge.filter(function(x){return x.id===tog.getAttribute('data-tog')})[0];if(k){k.enabled=tog.checked;save()}return}var c=e.target.closest('.card[data-id]');if(c){var item=D.knowledge.filter(function(x){return x.id===c.getAttribute('data-id')})[0];if(item)editKB(item,render)}}}})}
function editKB(item,refresh){var isNew=!item;showModal('<h3>'+(isNew?'新建':'编辑')+'条目</h3><div class="field"><label>名称</label><input id="fn" value="'+esc(item?item.name:'')+'"></div><div class="field"><label>触发关键词（逗号分隔，留空=常驻）</label><input id="fk" value="'+esc(item?(item.keywords||[]).join(', '):'')+'"></div><div class="field"><label>内容</label><textarea id="fc" style="min-height:120px">'+esc(item?item.content:'')+'</textarea></div><div class="btn-row"><button class="btn primary" id="kbSave">保存</button>'+(isNew?'':'<button class="btn danger" id="kbDel">删除</button>')+'</div>');$('kbSave').onclick=function(){var nm=$('fn').value.trim();var kw=$('fk').value.split(',').map(function(s){return s.trim()}).filter(Boolean);var c=$('fc').value.trim();if(!c)return toast('内容不能为空');if(isNew)D.knowledge.push({id:uid(),name:nm,keywords:kw,content:c,enabled:true});else{item.name=nm;item.keywords=kw;item.content=c}save();closeModal();if(refresh)refresh();renderHome();toast('已保存')};if(!isNew)$('kbDel').onclick=function(){D.knowledge=D.knowledge.filter(function(x){return x.id!==item.id});save();closeModal();if(refresh)refresh();renderHome()}}

function openSettings(){openScreen(function(el){el.innerHTML=navHTML('设置');var bd=document.createElement('div');bd.className='content';function row(id,ic,t,s){return '<div class="si" id="'+id+'"><div class="si-icon">'+ic+'</div><div class="si-label"><div class="si-t">'+t+'</div>'+(s?'<div class="si-s">'+s+'</div>':'')+'</div><div class="si-arr">\u203a</div></div>'}bd.innerHTML='<div class="st">外观</div>'+row('s-wp',IC16.img,'壁纸',(D.wallpaper||D.wallpaperUrl?'已设置':'未设置'))+row('s-ft',IC16.font,'字体预设',esc(D.activeFont||'默认'))+row('s-css',IC16.css,'自定义CSS',(D.customCSS?'已设置':'未设置'))+'<div class="st">API</div>'+row('s-api',IC16.bolt,'API 配置',(D.api.apiKey?esc(D.api.model):'未配置'))+'<div class="st">提示词与模板</div>'+row('s-pr',IC16.edit,'提示词（指令）')+row('s-tp',IC16.tpl,'模板（输出格式）')+row('s-jb',IC16.flag,'破限词','顶部/底部注入')+'<div class="st">数据</div>'+row('s-ex',IC16.up,'导出数据')+row('s-im',IC16.down,'导入数据')+'<div class="si" id="s-cl"><div class="si-icon" style="color:#c00">'+IC16.trash+'</div><div class="si-label"><div class="si-t" style="color:#c00">清空所有数据</div></div></div><input type="file" id="impF" accept=".json" style="display:none">';el.appendChild(bd);bd.querySelector('#s-wp').onclick=openWallpaperPage;bd.querySelector('#s-ft').onclick=openFontPresets;bd.querySelector('#s-css').onclick=openCustomCSS;bd.querySelector('#s-api').onclick=openApiConfig;bd.querySelector('#s-pr').onclick=function(){openTextEditor('prompts','提示词（指令）',BP)};bd.querySelector('#s-tp').onclick=function(){openTextEditor('templates','模板（输出格式）',BT)};bd.querySelector('#s-jb').onclick=openJailbreak;bd.querySelector('#s-ex').onclick=function(){download(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),'workshop_backup.json');toast('已导出')};bd.querySelector('#s-im').onclick=function(){$('impF').click()};$('impF').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{D=JSON.parse(r.result);for(var k in DEF){if(!(k in D))D[k]=JSON.parse(JSON.stringify(DEF[k function openWallpaperPage(){openScreen(function(el){el.innerHTML=navHTML('壁纸');var bd=document.createElement('div');bd.className='content';bd.innerHTML='<div class="hint">上传图片保存到本地，或输入URL，刷新不丢失。</div><div class="field"><label>图片URL</label><input id="wpUrl" value="'+esc(D.wallpaperUrl||'')+'" placeholder="https://..."></div><div class="btn-row"><button class="btn primary" id="wpApplyUrl">应用URL</button><button class="btn ghost" id="wpUpload">上传图片</button></div><input type="file" id="wpFile" accept="image/*" style="display:none"><div id="wpStatus" style="font-size:10px;color:var(--t3);margin-top:12px">'+(D.wallpaper==='indexeddb'?'当前：已上传图片':D.wallpaperUrl?'当前：URL壁纸':'当前：无壁纸')+'</div><div class="divider"></div><button class="btn outline" id="wpClear">清除壁纸</button>';el.appendChild(bd);bd.querySelector('#wpApplyUrl').onclick=function(){var url=bd.querySelector('#wpUrl').value.trim();if(!url)return toast('请输入URL');D.wallpaperUrl=url;D.wallpaper='';clearWpFromDB();save();applyWallpaper();bd.querySelector('#wpStatus').textContent='当前：URL壁纸';toast('已应用')};bd.querySelector('#wpUpload').onclick=function(){bd.querySelector('#wpFile').click()};bd.querySelector('#wpFile').onchange=function(e){var f=e.target.files[0];if(!f)return;var img=new Image();img.onload=function(){var maxW=1200;var w=img.width;var h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);canvas.toBlob(function(blob){saveWpToDB(blob,function(){D.wallpaper='indexeddb';D.wallpaperUrl='';save();applyWallpaper();bd.querySelector('#wpStatus').textContent='当前：已上传图片';toast('已保存')})},'image/jpeg',0.85)};img.src=URL.createObjectURL(f)};bd.querySelector('#wpClear').onclick=function(){D.wallpaper='';D.wallpaperUrl='';save();clearWpFromDB();applyWallpaper();bd.querySelector('#wpStatus').textContent='当前：无壁纸';toast('已清除')}})}
function openFontPresets(){openScreen(function(el){var pendingBlob=null;var pendingName='';render();function render(){el.innerHTML=navHTML('字体预设');var bd=document.createElement('div');bd.className='content';var h='<div class="hint">上传字体文件(.ttf .otf .woff .woff2)保存为预设。</div>';h+='<div class="font-card'+(D.activeFont?'':' active')+'" data-fn=""><div class="fc-name">默认字体</div></div>';for(var i=0;i<D.fontPresets.length;i++){var f=D.fontPresets[i];h+='<div class="font-card'+(D.activeFont===f.name?' active':'')+'" data-fn="'+esc(f.name)+'"><div class="fc-name">'+esc(f.name)+'</div><div class="fc-del" data-fdel="'+esc(f.name)+'">删除</div></div>'}h+='<div class="divider"></div><div class="field"><label>字体URL（可选）</label><input id="ftUrl" placeholder="https://...font.woff2"></div><div class="field"><label>字体名称</label><input id="ftN" value="'+esc(pendingName)+'" placeholder="给字体起个名字"></div><div class="btn-row"><button class="btn ghost" id="ftU">上传文件</button><button class="btn primary" id="ftSv">保存预设</button></div><input type="file" id="ftF" accept=".ttf,.otf,.woff,.woff2" style="display:none">';bd.innerHTML=h;el.appendChild(bd);bd.onclick=function(e){var del=e.target.closest('[data-fdel]');if(del){e.stopPropagation();var name=del.getAttribute('data-fdel');D.fontPresets=D.fontPresets.filter(function(f){return f.name!==name});if(D.activeFont===name){D.activeFont='';applyFont()}deleteFontFromDB(name);save();render();toast('已删除');return}var card=e.target.closest('.font-card');if(card){var fn=card.getAttribute('data-fn');D.activeFont=fn;save();applyFont();render();toast(fn?'已切换：'+fn:'已切换默认');return}};bd.querySelector('#ftU').onclick=function(){bd.querySelector('#ftF').click()};bd.querySelector('#ftF').onchange=function(e){var f=e.target.files[0];if(!f)return;pendingName=f.name.replace(/\.[^.]+$/,'');bd.querySelector('#ftN').value=pendingName;pendingBlob=f;toast('已加载：'+pendingName)};bd.querySelector('#ftSv').onclick=function(){var name=bd.querySelector('#ftN').value.trim();var url=bd.querySelector('#ftUrl').value.trim();if(!name)return toast('请输入字体名称');if(D.fontPresets.some(function(x){return x.name===name}))return toast('同名预设已存在');if(url){D.fontPresets.push({name:name,url:url});D.activeFont=name;save();applyFont();render();toast('已保存并应用')}else if(pendingBlob){saveFontToDB(name,pendingBlob,function(){D.fontPresets.push({name:name});D.activeFont=name;save();var objUrl=URL.createObjectURL(pendingBlob);_fontURLCache[name]=objUrl;applyFont();render();toast('已保存并应用');pendingBlob=null;pendingName=''})}else{toast('请上传文件或输入URL')}}}})}

function openApiConfig(){openScreen(function(el){var c=D.api;el.innerHTML=navHTML('API 配置');var bd=document.createElement('div');bd.className='content';var h='<div class="hint">支持OpenAI兼容接口。</div>';h+='<div class="field"><label>Base URL</label><input id="au" value="'+esc(c.baseUrl)+'"></div>';h+='<div class="field"><label>API Key</label><input id="ak" type="password" value="'+esc(c.apiKey)+'" placeholder="sk-..."></div>';h+='<div class="field"><label>Model</label><div style="display:flex;gap:6px"><input id="am" value="'+esc(c.model)+'" style="flex:1"><button class="btn-sm btn ghost" id="fetchM">拉取</button></div></div>';h+='<div id="modelList" style="display:none;max-height:200px;overflow-y:auto;margin:-8px 0 14px"></div>';h+='<div class="field"><label>Temperature：<span id="tv">'+c.temperature+'</span></label><input id="at" type="range" min="0" max="2" step="0.1" value="'+c.temperature+'" style="accent-color:var(--acc)"></div>';h+='<div class="field"><label>最大输出长度</label><input id="amx" type="number" value="'+(c.maxTokens||32000)+'"></div>';h+='<div class="btn-row"><button class="btn primary" id="apiSv">保存</button><button class="btn ghost" id="apiTest">测试</button></div><button class="btn outline" id="apiSavePreset" style="margin-top:9px">存为预设</button>';if(D.apiPresets&&D.apiPresets.length){h+='<div class="st">预设</div>';for(var i=0;i<D.apiPresets.length;i++){var p=D.apiPresets[i];h+='<div class="api-preset" data-api="'+i+'"><div class="ap-name">'+esc(p.name)+'</div><div class="ap-info">'+esc(p.model)+'</div><div class="ap-del" data-apidel="'+i+'">\u00d7</div></div>'}}bd.innerHTML=h;el.appendChild(bd);bd.querySelector('#at').oninput=function(e){bd.querySelector('#tv').textContent=e.target.value};bd.querySelector('#fetchM').onclick=function(){var url=bd.querySelector('#au').value.trim().replace(/\/$/,'');var key=bd.querySelector('#ak').value.trim();if(!url||!key)return toast('请先填写URL和Key');toast('拉取中...');fetchModels(url,key,function(err,names){if(err)return toast('拉取失败 .api.apiKey=p.apiKey;D.api.model=p.model;D.api.temperature=p.temperature;save();back();openApiConfig();toast('已加载：'+p.name)}}})}

  /* === 面具页 === */
  function renderCUser(p){var cur=getDefaultMask();var h='<div class="chat-list-header"><h1 onclick="back()">面具</h1><div class="chl-btn" id="cuA">+</div></div><div style="padding:0 20px">';if(cur){h+='<div class="mask-namecard"><div class="mnc-top"><div class="mnc-av" id="mncAv">'+(cur.avatar?'<img src="'+esc(cur.avatar)+'">':esc((cur.name||'?')[0]))+'</div><div><div class="mnc-name">'+esc(cur.name)+'</div><div class="mnc-sub">当前使用中 · 点头像换图</div></div></div><div class="mnc-body">'+esc(cur.content||'（暂无设定）')+'</div></div>';h+='<div class="mask-switch-row">';for(var i=0;i<D.userMasks.length;i++){var mk=D.userMasks[i];h+='<div class="mask-mini'+(D.defaultMaskId===mk.id?' on':'')+'" data-mk="'+mk.id+'"><div class="mask-mini-av">'+(mk.avatar?'<img src="'+esc(mk.avatar)+'">':esc((mk.name||'?')[0]))+'</div><div class="mask-mini-name">'+esc(mk.name)+'</div></div>'}h+='<div class="mask-add-mini" id="mAdd"><div class="maa">+</div><div class="mask-mini-name">新建</div></div>';h+='</div>';h+='<div class="btn-row"><button class="btn primary" id="mEdit">编辑此面具</button><button class="btn danger" id="mDel">删除</button></div>'}else{h+='<div class="empty">还没有面具<br>点右上角 + 新建</div>'}h+='<div class="st">全局User设定（无面具时兜底）</div><div class="field"><textarea id="cuT" style="min-height:80px">'+esc(D.chatUserSetting||'')+'</textarea></div><button class="btn ghost" id="cuSv" style="margin-bottom:16px">保存全局设定</button>';var userItems=D.storage.filter(function(s){return s.type==='user'});if(userItems.length){h+='<div class="st">从存储导入为面具</div>';for(var i=0;i<userItems.length;i++){h+='<div class="card" data-imp="'+userItems[i].id+'"><div class="c-t">'+esc(userItems[i].title)+'</div><div class="c-b">'+esc((userItems[i].content||'').slice(0,60))+'</div></div>'}}h+='</div>';p.innerHTML=h;var avEl=p.querySelector('#mncAv');if(avEl)avEl.onclick=function(){if(cur)pickAvatar(function(src){cur.avatar=src;save();renderCUser(p)})};p.querySelector('#cuSv').onclick=function(){D.chatUserSetting=p.querySelector('#cuT').value;save();toast('已保存')};function newMask(){showModal('<h3>新建面具</h3><div class="field"><label>面具名称</label><input id="mnN" placeholder="如：小透"></div><div class="field"><label>面具设定</label><textarea id="mnC" placeholder="粘贴User设定"></textarea></div><div class="btn-row"><button class="btn primary" id="mnS">创建</button><button class="btn ghost" onclick="closeModal()">取消</button></div>');$('mnS').onclick=function(){var n=$('mnN').value.trim();if(!n)return toast('请输入名称');var mk={id:uid(),name:n,content:$('mnC').value,avatar:''};D.userMasks.push(mk);D.defaultMaskId=mk.id;save();closeModal();renderCUser(p)}}var addBtn=p.querySelector('#cuA');addBtn.onclick=newMask;var mAdd=p.querySelector('#mAdd');if(mAdd)mAdd.onclick=newMask;var mEdit=p.querySelector('#mEdit');if(mEdit)mEdit.onclick=function(){editMask(cur,function(){renderCUser(p)})};var mDel=p.querySelector('#mDel');if(mDel)mDel.onclick=function(){D.userMasks=D.userMasks.filter(function(x){return x.id!==cur.id});D.defaultMaskId=D.userMasks.length?D.userMasks[0].id:'';save();renderCUser(p);toast('已删除')};p.onclick=function(e){if(e.target.closest('#cuA')||e.target.closest('#mAdd'))return;var mini=e.target.closest('.mask-mini');if(mini){D.defaultMaskId=mini.getAttribute('data-mk');save();renderCUser(p);return}var imp=e.target.closest('[data-imp]');if(imp){var item=D.storage.filter(function(x){return x.id===imp.getAttribute('data-imp')})[0];if(item){var mk={id:uid(),name:item.title||'面具',content:item.content||'',avatar:''};D.userMasks.push(mk);D.defaultMaskId=mk.id;save();renderCUser(p);toast('已导入为面具')}}}}
  function editMask(mk,onDone){if(!mk)return;openScreen(function(el){el.innerHTML=navHTML(mk.name);var bd=document.createElement('div');bd.className='content';bd.innerHTML='<div class="av-up">'+avatarHTML(mk.avatar,56,(mk.name||'?')[0],'chat-win-avatar')+'<button class="btn-sm btn ghost" id="mkAv">更换头像</button></div><div class="field"><label>名称</label><input id="mkN" value="'+esc(mk.name)+'"></div><div class="field"><label>面具设定</label><textarea id="mkC" style="min-height:200px">'+esc(mk.content)+'</textarea></div><button class="btn primary" id="mkSv">保存</button>';el.appendChild(bd);bd.querySelector('#mkAv').onclick=function(){pickAvatar(function(src){mk.avatar=src;save();back();if(onDone)onDone()})};bd.querySelector('#mkSv').onclick=function(){mk.name=bd.querySelector('#mkN').value.trim();mk.content=bd.querySelector('#mkC').value;save();toast('已保存');back();if(onDone)onDone()}})}
})}

/* === 世界书条目编辑弹窗 === */
function editCWE(arr,idx,onDone){var item=arr[idx];if(!item)return;showModal('<h3>编辑世界书条目</h3><div class="field"><label>名称</label><input id="ewn" value="'+esc(item.name)+'"></div><div class="field"><label>注入位置</label><select id="ewp"><option value="before"'+(item.position==='before'?' selected':'')+'>前段（常驻背景）</option><option value="middle"'+(item.position==='middle'?' selected':'')+'>中段（关键词触发）</option><option value="after"'+(item.position==='after'?' selected':'')+'>后段（输出前规则）</option></select></div><div class="field"><label>触发关键词（逗号分隔，留空=常驻）</label><input id="ewk" value="'+esc(item.keywords||'')+'"></div><div class="field"><label>内容</label><textarea id="ewc" style="min-height:100px">'+esc(item.content)+'</textarea></div><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span style="font-size:11px">启用</span><label class="switch"><input type="checkbox" id="ewe" '+(item.enabled?'checked':'')+'><span class="slider"></span></label></div><div class="btn-row"><button class="btn primary" id="ewS">保存</button><button class="btn danger" id="ewD">删除</button></div>');$('ewS').onclick=function(){item.name=$('ewn').value.trim();item.position=$('ewp').value;item.keywords=$('ewk').value.trim();item.content=$('ewc').value;item.enabled=$('ewe').checked;save();closeModal();if(onDone)onDone()};$('ewD').onclick=function(){arr.splice(idx,1);save();closeModal();if(onDone)onDone()}}

/* === 构建聊天系统提示（含真人分条内置提示词 + 世界书三段注入） === */
function buildCS(ct,chat){var msgs=[];var mask=getMask(chat.maskId)||getDefaultMask();var userName=(mask&&mask.name)||'对方';
  // 1. 顶部：真人分条聊天内置提示词
  msgs.push({role:'system',content:chatSysPrompt(chat.name,userName)});
  if(!ct)return msgs;
  // 2. 前段：世界观 + before 世界书
  var bP=[];if(ct.worldview)bP.push('[世界观]\n'+ct.worldview);var wb=ct.worldbook||[];for(var i=0;i<wb.length;i++){if(wb[i].enabled&&wb[i].position==='before'&&(!wb[i].keywords||sT(wb[i].keywords,chat)))bP.push('['+wb[i].name+']\n'+wb[i].content)}for(var i=0;i<D.chatWorldbook.length;i++){var cw=D.chatWorldbook[i];if(cw.enabled&&cw.position==='before'&&(!cw.keywords||sT(cw.keywords,chat)))bP.push('['+cw.name+']\n'+cw.content)}if(bP.length)msgs.push({role:'system',content:bP.join('\n\n')});
  // 3. 角色设定
  if(ct.persona)msgs.push({role:'system',content:'[角色设定]\n'+ct.persona});
  // 4. 中段：middle 世界书
  var mP=[];for(var i=0;i<wb.length;i++){if(wb[i].enabled&&wb[i].position==='middle'&&(!wb[i].keywords||sT(wb[i].keywords,chat)))mP.push('['+wb[i].name+']\n'+wb[i].content)}for(var i=0;i<D.chatWorldbook.length;i++){var cw=D.chatWorldbook[i];if(cw.enabled&&cw.position==='middle'&&(!cw.keywords||sT(cw.keywords,chat)))mP.push('['+cw.name+']\n'+cw.content)}if(mP.length)msgs.push({role:'system',content:mP.join('\n\n')});
  // 5. User 设定（面具优先）
  var userS=ct.userSetting||(mask?mask.content:'')||D.chatUserSetting||'';if(userS)msgs.push({role:'system',content:'[你正在对话的对方（User）设定]\n'+userS});
  // 6. 后段：after 世界书（行为规范/红线）
  var aP=[];for(var i=0;i<wb.length;i++){if(wb[i].enabled&&wb[i].position==='after'&&(!wb[i].keywords||sT(wb[i].keywords,chat)))aP.push('['+wb[i].name+']\n'+wb[i].content)}for(var i=0;i<D.chatWorldbook.length;i++){var cw=D.chatWorldbook[i];if(cw.enabled&&cw.position==='after'&&(!cw.keywords||sT(cw.keywords,chat)))aP.push('['+cw.name+']\n'+cw.content)}if(aP.length)msgs.push({role:'system',content:aP.join('\n\n')});
  // 7. 再次强调分条（放最后，权重最高）
  msgs.push({role:'system',content:'再次提醒：像真人打字一样回复，把话拆成2-5条短消息，每条之间用一行 '+CHAT_MSG_SPLIT+' 分隔，不要写动作神态和括号旁白。'});
  return msgs}
function sT(kw,chat){if(!kw)return true;var ks=kw.split(',').map(function(s){return s.trim()}).filter(Boolean);if(!ks.length)return true;var r='';var m=chat.messages||[];var s=Math.max(0,m.length-5);for(var i=s;i<m.length;i++)r+=m[i].content+'';for(var i=0;i<ks.length;i++){if(r.indexOf(ks[i])!==-1)return true}return false}

/* ========== 启动 ========== */
applyTheme();
renderHome();
</script>
