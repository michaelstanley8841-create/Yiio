<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Workshop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f2f2;--card:rgba(255,255,255,.85);--text:#111;--t2:#666;--t3:#aaa;--border:rgba(0,0,0,.07);--acc:#111;--tag-bg:rgba(0,0,0,.05);--tag-on:#111;--r:14px;--font:'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif}
html,body{height:100%;font-family:var(--font);background:#ddd;color:var(--text);overflow:hidden;font-weight:300;font-size:14px;line-height:1.6}
body{display:flex;align-items:center;justify-content:center}
.phone{width:100%;max-width:430px;height:100%;max-height:932px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:460px){.phone{border-radius:40px;height:93vh;box-shadow:0 24px 80px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.12)}}
.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);opacity:0;transition:transform .35s cubic-bezier(.32,.72,.32,1),opacity .22s;background:var(--bg);z-index:10}
.screen.active{transform:translateX(0);opacity:1}
.screen.home{transform:translateX(0);opacity:1;z-index:1}
.screen::-webkit-scrollbar{width:0}
.home-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.home-inner{position:relative;z-index:1;padding:0 28px 20px;min-height:100%;display:flex;flex-direction:column}
.clock-area{padding:56px 0 36px;text-align:center}
.clock-time{font-size:68px;font-weight:200;letter-spacing:-3px;line-height:1}
.clock-date{font-size:11px;color:var(--t2);margin-top:8px;letter-spacing:2px}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 14px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;-webkit-user-select:none}
.app-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--card);backdrop-filter:blur(20px);border:.5px solid var(--border);transition:transform .12s;position:relative}
.app:active .app-icon{transform:scale(.88)}
.app-name{font-size:10px;color:var(--t2);letter-spacing:.3px}
.badge{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;background:#222;border-radius:8px;font-size:8px;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 4px}
.dock{margin-top:auto;padding:18px 16px 8px;display:flex;justify-content:center;gap:22px}
.dock .app-icon{width:48px;height:48px;border-radius:13px}
.nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(30px);background:rgba(242,242,242,.88);padding:13px 18px 11px;display:flex;align-items:center;gap:10px;border-bottom:.5px solid var(--border)}
.back-btn{background:none;border:none;color:var(--text);font-size:13px;cursor:pointer;font-family:var(--font);font-weight:400;padding:4px 0}
.nav-act{background:none;border:none;color:var(--t2);font-size:12px;cursor:pointer;font-family:var(--font);padding:6px 12px;border-radius:20px}
.nav-act.solid{background:var(--acc);color:#fff;font-weight:400}
.content{padding:18px}
.st{font-size:10px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin:20px 0 8px;font-weight:400}
.st:first-child{margin-top:0}
.hint{font-size:11px;color:var(--t3);line-height:1.7;margin-bottom:12px}
.card{background:var(--card);backdrop-filter:blur(16px);border:.5px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:9px;cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.985)}
.card .c-t{font-size:13px;font-weight:500;margin-bottom:3px}
.card .c-b{font-size:11px;color:var(--t2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.card .c-m{font-size:9px;color:var(--t3);margin-top:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.c-tag{font-size:9px;padding:2px 7px;border-radius:5px;background:var(--tag-bg);color:var(--t2)}
.empty{text-align:center;padding:44px 20px;color:var(--t3);font-size:11px;line-height:1.8}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;color:var(--t3);margin-bottom:5px;letter-spacing:1px;text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;background:var(--card);border:.5px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:13px;font-family:var(--font);font-weight:300;transition:border .2s}
.field textarea{min-height:80px;line-height:1.7;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--acc)}
.field input::placeholder,.field textarea::placeholder{color:#bbb}
.tags-wrap{margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.tag{font-size:11px;padding:5px 11px;border-radius:20px;background:var(--tag-bg);color:var(--t2);cursor:pointer;transition:all .12s;-webkit-user-select:none;display:inline-flex;align-items:center;gap:4px}
.tag.on{background:var(--tag-on);color:#fff}
.tag:active{transform:scale(.93)}
.tag-x{font-size:13px;font-weight:bold;opacity:.6;cursor:pointer;line-height:1;margin-left:2px}
.custom-tag-input{display:flex;gap:5px}
.custom-tag-input input{flex:1;padding:6px 10px;font-size:11px;border-radius:8px;border:.5px solid var(--border);background:var(--card);color:var(--text);font-family:var(--font)}
.custom-tag-input input:focus{outline:none;border-color:var(--acc)}
.custom-tag-input button{padding:6px 12px;font-size:11px;border-radius:8px;border:none;background:var(--acc);color:#fff;cursor:pointer}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:13px;font-weight:400;cursor:pointer;font-family:var(--font);letter-spacing:.3px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:#fff}
.btn.ghost{background:var(--tag-bg);color:var(--text)}
.btn.outline{background:none;border:.5px solid var(--border);color:var(--t2)}
.btn.danger{background:none;border:.5px solid #c00;color:#c00}
.btn:disabled{opacity:.35}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-row .btn{margin:0}
.btn-sm{padding:7px 12px;font-size:11px;width:auto;border-radius:8px}
.switch{position:relative;width:40px;height:22px;flex:0 0 40px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#ddd;border-radius:22px;transition:.2s;cursor:pointer}
.slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switch input:checked+.slider{background:var(--acc)}
.switch input:checked+.slider::before{transform:translateX(18px)}
.si{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:.5px solid var(--border);cursor:pointer}
.si:last-child{border:none}
.si-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--tag-bg);flex:0 0 28px;color:var(--t2)}
.si-label{flex:1}
.si-t{font-size:13px}
.si-s{font-size:10px;color:var(--t3);margin-top:1px}
.rb{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.rb-h{display:flex;align-items:center;gap:8px;padding:11px 13px;font-size:12px;font-weight:500;border-bottom:.5px solid var(--border)}
.rb textarea{width:100%;border:none;background:transparent;color:var(--text);padding:11px 13px;font-size:12px;line-height:1.7;min-height:160px;font-family:var(--font);font-weight:300;resize:vertical}
.rb textarea:focus{outline:none}
.mm{position:absolute;inset:0;background:rgba(0,0,0,.22);backdrop-filter:blur(2px);z-index:600;display:none;align-items:flex-end}
.mm.show{display:flex}
.modal{width:100%;background:var(--bg);border-radius:16px 16px 0 0;padding:20px 18px 30px;max-height:82%;overflow-y:auto;animation:mup .3s cubic-bezier(.32,.72,.32,1)}
@keyframes mup{from{transform:translateY(100%)}}
.modal h3{font-size:14px;font-weight:500;margin-bottom:14px}
.lm{position:absolute;inset:0;background:rgba(242,242,242,.92);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:500;gap:14px}
.lm.show{display:flex}
.dots{display:flex;gap:4px}
.dots span{width:5px;height:5px;border-radius:50%;background:var(--acc);animation:bce .6s infinite alternate}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes bce{to{opacity:.15;transform:translateY(-5px)}}
.lm p{font-size:10px;color:var(--t3);letter-spacing:1.5px}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(10px);background:var(--acc);color:#fff;padding:8px 18px;border-radius:20px;font-size:11px;opacity:0;transition:.25s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kw-chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.kw-chip{font-size:9px;padding:2px 6px;border-radius:5px;background:var(--tag-bg);color:var(--t2)}
.gen-sec{margin-bottom:16px}
.gen-sec-t{font-size:11px;color:var(--t2);margin-bottom:7px;font-weight:400;display:flex;align-items:center;gap:5px}
.gen-sec-t::before{content:'';width:2px;height:9px;background:var(--acc);display:inline-block}
.inspire-box{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:14px}
.inspire-box textarea{border:none;background:none;width:100%;font-size:13px;color:var(--text);font-family:var(--font);font-weight:300;line-height:1.7;min-height:60px;resize:none}
.inspire-box textarea:focus{outline:none}
.kb-item{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--card);border:.5px solid var(--border);border-radius:10px;margin-bottom:5px;cursor:pointer;transition:.12s}
.kb-item.on{border-color:var(--acc);background:var(--tag-on);color:#fff}
.kb-item.on .kb-name,.kb-item.on .kb-type{color:#fff}
.kb-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);flex:0 0 16px;display:flex;align-items:center;justify-content:center;font-size:9px;transition:.12s}
.kb-item.on .kb-check{background:#fff;border-color:#fff;color:var(--acc)}
.kb-name{font-size:11px;flex:1}
.kb-type{font-size:9px;color:var(--t3)}
.ref-card{background:var(--card);border:.5px solid var(--border);border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer}
.ref-card.on{border-color:var(--acc)}
.ref-card .rc-t{font-size:11px;font-weight:500}
.ref-card .rc-b{font-size:10px;color:var(--t3);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.divider{height:.5px;background:var(--border);margin:16px 0}
.row-2{display:flex;gap:8px}
.row-2>*{flex:1}
.fold-head{display:flex;align-items:center;gap:8px;padding:10px 0;cursor:pointer;border-bottom:.5px solid var(--border)}
.fold-head .fh-t{font-size:13px;font-weight:500;flex:1}
.fold-head .fh-n{font-size:10px;color:var(--t3)}
.fold-head .fh-arr{color:var(--t3);transition:transform .2s;font-size:10px}
.fold-head.open .fh-arr{transform:rotate(90deg)}
.fold-body{display:none;padding:8px 0}
.fold-head.open+.fold-body{display:block}
.copy-btn{background:none;border:.5px solid var(--border);border-radius:6px;padding:4px 10px;font-size:10px;color:var(--t2);cursor:pointer;font-family:var(--font)}
.inspire-pick{background:var(--card);border:.5px solid var(--border);border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:8px}
.inspire-pick.on{border-color:var(--acc)}
.inspire-pick .ip-b{font-size:11px;color:var(--t2);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.font-card{padding:12px;background:var(--card);border:.5px solid var(--border);border-radius:var(--r);margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.font-card.active{border-color:var(--acc)}
.font-card .fc-name{font-size:13px;flex:1}
.font-card .fc-del{font-size:11px;color:#c00;cursor:pointer;padding:4px 8px}

/* 聊天应用样式 */
.chat-app{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.chat-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.chat-body::-webkit-scrollbar{width:0}
.chat-bottom-bar{display:flex;align-items:stretch;border-top:.5px solid var(--border);background:rgba(242,242,242,.95);backdrop-filter:blur(20px);height:52px;flex:0 0 52px}
.chat-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--t3);transition:.15s}
.chat-bar-item.on{color:var(--text)}
.chat-bar-item svg{opacity:.5;transition:.15s}
.chat-bar-item.on svg{opacity:1}
.chat-bar-label{font-size:9px;letter-spacing:.3px}
.chat-list-header,.contact-header{padding:50px 22px 14px;display:flex;align-items:flex-end}
.chat-list-header h1,.contact-header h1{font-size:28px;font-weight:300;flex:1;letter-spacing:-1px;cursor:pointer}
.chat-list-item,.contact-item{display:flex;align-items:center;gap:14px;padding:14px 22px;cursor:pointer;transition:background .1s}
.chat-list-item:active,.contact-item:active{background:rgba(0,0,0,.03)}
.chat-avatar,.contact-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#e8e8e8,#d0d0d0);display:flex;align-items:center;justify-content:center;flex:0 0 46px;font-size:17px;font-weight:400;color:var(--t2);letter-spacing:-1px;overflow:hidden}
.contact-avatar{width:40px;height:40px;flex:0 0 40px;font-size:15px}
.chat-avatar img,.contact-avatar img{width:100%;height:100%;object-fit:cover}
.chat-info,.contact-info{flex:1;overflow:hidden;border-bottom:.5px solid var(--border);padding-bottom:14px}
.contact-info{padding:10px 0}
.chat-list-item:last-child .chat-info,.contact-item:last-child .contact-info{border:none}
.chat-name,.contact-name{font-size:14px;font-weight:400;display:flex;align-items:center;gap:6px}
.chat-name-time{font-size:9px;color:var(--t3);font-weight:300;margin-left:auto}
.chat-last{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;font-weight:300}
.contact-sub{font-size:10px;color:var(--t3);margin-top:2px}

/* 聊天窗口 */
.chat-win{display:flex;flex-direction:column;height:100%;background:#e9e9e9}
.chat-win-header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(242,242,242,.92);backdrop-filter:blur(30px);border-bottom:.5px solid var(--border);min-height:56px;box-shadow:0 1px 8px rgba(0,0,0,.03)}
.chat-win-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#e0e0e0,#ccc);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t2);overflow:hidden}
.chat-win-avatar img{width:100%;height:100%;object-fit:cover}
.chat-win-info{flex:1;cursor:pointer}
.chat-win-name{font-size:14px;font-weight:500}
.chat-win-status{font-size:9px;color:var(--t3)}
.chat-win-cfg{background:none;border:none;color:var(--t3);cursor:pointer;padding:6px;font-size:16px}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:3px;background:linear-gradient(180deg,#ededed,#e6e6e6)}
.chat-messages::-webkit-scrollbar{width:0}
.msg-sender{font-size:9px;color:var(--t3);margin:8px 4px 2px;letter-spacing:.3px}
.msg{max-width:75%;padding:9px 14px;font-size:13px;line-height:1.7;font-weight:300;word-break:break-word;white-space:pre-wrap}
.msg.ai{background:#fff;border-radius:4px 18px 18px 18px;color:var(--text);align-self:flex-start;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.msg.user-msg{background:var(--acc);color:#fff;border-radius:18px 18px 4px 18px;align-self:flex-end;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.msg.sys{background:transparent;color:var(--t3);font-size:10px;align-self:center;text-align:center;max-width:90%;padding:12px 0}
.typing-indicator{display:flex;align-items:center;gap:3px;padding:12px 16px;align-self:flex-start}
.typing-indicator span{width:6px;height:6px;border-radius:50%;background:#bbb;animation:typd .8s infinite alternate}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes typd{to{opacity:.2;transform:translateY(-4px)}}
.chat-input-area{background:rgba(242,242,242,.95);backdrop-filter:blur(20px);border-top:.5px solid var(--border);padding:8px 12px 12px}
.chat-input-row{display:flex;align-items:flex-end;gap:8px}
.chat-input-row textarea{flex:1;background:#fff;border:.5px solid var(--border);border-radius:20px;padding:9px 16px;font-size:13px;font-family:var(--font);font-weight:300;color:var(--text);resize:none;max-height:100px;line-height:1.5;transition:border .2s}
.chat-input-row textarea:focus{outline:none;border-color:#999}
.chat-input-row textarea::placeholder{color:#bbb}
.chat-send-btn{width:32px;height:32px;border-radius:50%;background:var(--acc);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 32px;transition:all .15s}
.chat-send-btn:active{transform:scale(.88)}
.chat-send-btn:disabled{background:#ccc}
.continue-btn{align-self:center;margin:8px 0;padding:6px 16px;font-size:11px;border-radius:20px;background:var(--card);border:.5px solid var(--border);color:var(--t2);cursor:pointer;font-family:var(--font)}
.continue-btn:active{transform:scale(.95)}

.wb-entry{background:var(--card);border:.5px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.wb-entry .wb-t{font-size:12px;font-weight:500;margin-bottom:2px}
.wb-entry .wb-pos{font-size:9px;color:var(--t3)}
.wb-entry-on{border-color:var(--acc)}
.api-preset{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border:.5px solid var(--border);border-radius:10px;margin-bottom:5px;cursor:pointer}
.api-preset.on{border-color:var(--acc)}
.api-preset .ap-name{font-size:12px;flex:1;font-weight:400}
.api-preset .ap-info{font-size:9px;color:var(--t3)}
.api-preset .ap-del{font-size:10px;color:#c00;padding:2px 6px;cursor:pointer}

/* 面具名片 */
.mask-namecard{background:linear-gradient(135deg,#1a1a1a,#333);color:#fff;border-radius:18px;padding:24px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.mask-namecard .mnc-top{display:flex;align-items:center;gap:14px}
.mask-namecard .mnc-av{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;flex:0 0 56px;cursor:pointer;border:1px solid rgba(255,255,255,.2)}
.mask-namecard .mnc-av img{width:100%;height:100%;object-fit:cover}
.mask-namecard .mnc-name{font-size:20px;font-weight:400;letter-spacing:1px}
.mask-namecard .mnc-sub{font-size:10px;opacity:.6;margin-top:3px}
.mask-namecard .mnc-body{font-size:11px;line-height:1.7;opacity:.85;margin-top:16px;max-height:120px;overflow-y:auto;white-space:pre-wrap}
.mask-namecard .mnc-body::-webkit-scrollbar{width:0}
.mask-switch-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:12px}
.mask-switch-row::-webkit-scrollbar{height:0}
.mask-mini{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;opacity:.5;transition:.15s}
.mask-mini.on{opacity:1}
.mask-mini-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#e8e8e8,#d0d0d0);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--t2);overflow:hidden}
.mask-mini-av img{width:100%;height:100%;object-fit:cover}
.mask-mini.on .mask-mini-av{box-shadow:0 0 0 2px var(--acc)}
.mask-mini-name{font-size:9px;color:var(--t2);max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mask-add-mini{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;width:42px}
.mask-add-mini .maa{width:42px;height:42px;border-radius:50%;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--t3)}
</style>
</head>
<body>
<div class="phone" id="phone">
<div class="screens" id="screens">
<div class="screen home active" id="screen-home">
<div class="home-bg" id="homeBg"></div>

BP.inspire=['你是AIRP角色扮演的创意灵感生成器。偏向日常、恋爱、人际关系方向。','','【核心原则】','1. 灵感要有钩子——一个让人想往下写的点，不是一个完整的故事。','2. 关系灵感要有张力——不是"两个人很甜"，是"甜的表面下有一根刺"。','3. 场景灵感要有氛围——写得出空气的温度和光线的角度。','4. 避免俗套：不要"雨天共撑一把伞""醉酒后吐露真心"这种用烂的桥段。','5. 每条灵感3-5句话，点到为止，留出发挥空间。'].join('\n');

function getP(t){return(D.prompts&&D.prompts[t])||BP[t]||''}
function getT(t){return(D.templates&&D.templates[t])||BT[t]||''}

function callLLM(msgs,max){max=max||4096;var c=D.api;if(!c.apiKey)return Promise.reject(new Error('请先配置API Key'));var all=[];if(D.jailbreak.top)all.push({role:'system',content:D.jailbreak.top});all=all.concat(msgs);if(D.jailbreak.bottom)all.push({role:'system',content:D.jailbreak.bottom});return fetch(c.baseUrl+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.apiKey},body:JSON.stringify({model:c.model,messages:all,temperature:c.temperature,max_tokens:max})}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+t.slice(0,100))});return r.json()}).then(function(d){return(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||'').trim()||'(空)'})}
function buildKB(theme,ids){var items=[];for(var i=0;i<D.knowledge.length;i++){var k=D.knowledge[i];if(!k.enabled||ids.indexOf(k.id)===-1)continue;if(!k.keywords||!k.keywords.length){items.push(k);continue}for(var j=0;j<k.keywords.length;j++){if((theme||'').indexOf(k.keywords[j])!==-1){items.push(k);break}}}if(!items.length)return'';return'\u3010知识库参考\u3011\n'+items.map(function(k){return'['+(k.name||'条目')+']\n'+k.content}).join('\n\n')}
function fetchModels(baseUrl,apiKey,cb){fetch(baseUrl+'/models',{headers:{'Authorization':'Bearer '+apiKey}}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){var list=(d.data||d||[]);if(!Array.isArray(list))list=[];var names=list.map(function(m){return m.id||m.name||''}).filter(Boolean).sort();cb(null,names)}).catch(function(e){cb(e)})}

function avatarHTML(src,size,initial){size=size||46;initial=initial||'?';if(src)return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;overflow:hidden;flex:0 0 '+size+'px"><img src="'+esc(src)+'" style="width:100%;height:100%;object-fit:cover"></div>';return '<div class="chat-avatar" style="width:'+size+'px;height:'+size+'px;flex:0 0 '+size+'px;font-size:'+Math.round(size*0.37)+'px">'+esc(initial)+'</div>'}
function pickAvatar(cb){var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=function(){var f=inp.files[0];if(!f)return;var img=new Image();img.onload=function(){var s=Math.min(img.width,img.height,200);var canvas=document.createElement('canvas');canvas.width=s;canvas.height=s;var ctx=canvas.getContext('2d');var sx=(img.width-s)/2,sy=(img.height-s)/2;ctx.drawImage(img,sx,sy,s,s,0,0,s,s);cb(canvas.toDataURL('image/jpeg',0.8))};img.src=URL.createObjectURL(f)};inp.click()}
function getMask(id){for(var i=0;i<D.userMasks.length;i++){if(D.userMasks[i].id===id)return D.userMasks[i]}return null}
function getDefaultMask(){return getMask(D.defaultMaskId)||D.userMasks[0]||null}

function tickClock(){var d=new Date();$('clockTime').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');var days=['\u65e5','\u4e00','\u4e8c','\u4e09','\u56db','\u4e94','\u516d'];$('clockDate').textContent=(d.getMonth()+1)+'\u6708'+d.getDate()+'\u65e5 \u661f\u671f'+days[d.getDay()]}
setInterval(tickClock,5000);tickClock();

function TagPicker(type,gk,sel){this.type=type;this.gk=gk;this.sel=sel;this.el=document.createElement('div');this.el.className='tags-wrap';this._bindEvents();this.render()}
TagPicker.prototype._getAll=function(){var b=(TAGS[this.type]&&TAGS[this.type][this.gk])||[];var ck=this.type+'_'+this.gk;var c=D.customTags[ck]||[];return{builtIn:b,custom:c,all:b.concat(c)}};
TagPicker.prototype.render=function(){var data=this._getAll();var sel=this.sel[this.gk]||[];var h='<div class="tags">';for(var i=0;i<data.all.length;i++){var t=data.all[i];var isOn=sel.indexOf(t)!==-1;var isCust=i>=data.builtIn.length;h+='<span class="tag'+(isOn?' on':'')+'" data-action="toggle" data-val="'+esc(t)+'">'+esc(t);if(isCust)h+=' <span class="tag-x" data-action="delete" data-val="'+esc(t)+'">\u00d7</span>';h+='</span>'}h+='</div><div class="custom-tag-input"><input placeholder="自定义标签" data-role="ci"><button data-action="add">+</button></div>';this.el.innerHTML=h};
TagPicker.prototype._bindEvents=function(){var self=this;this.el.addEventListener('click',function(e){var t=e.target;var a=t.getAttribute('data-action');if(a==='delete'){e.stopPropagation();var v=t.getAttribute('data-val');var ck=self.type+'_'+self.gk;D.customTags[ck]=(D.customTags[ck]||[]).filter(function(x){return x!==v});self.sel[self.gk]=(self.sel[self.gk]||[]).filter(function(x){return x!==v});save();self.render();return}var tag=t.closest('.tag');if(tag&&tag.getAttribute('data-action')==='toggle'){var v=tag.getAttribute('data-val');if(!self.sel[self.gk])self.sel[self.gk]=[];var idx=self.sel[self.gk].indexOf(v);if(idx!==-1){self.sel[self.gk].splice(idx,1);tag.classList.remove('on')}else{self.sel[self.gk].push(v);tag.classList.add('on')}return}if(a==='add'){var inp=self.el.querySelector('[data-role="ci"]');var v=inp.value.trim();if(!v)return;var ck=self.type+'_'+self.gk;var data=self._getAll();if(data.all.indexOf(v)===-1){if(!D.customTags[ck])D.customTags[ck]=[];D.customTags[ck].push(v);save()}if(!self.sel[self.gk])self.sel[self.gk]=[];if(self.sel[self.gk].indexOf(v)===-1)self.sel[self.gk].push(v);inp.value='';self.render()}});this.el.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.getAttribute('data-role')==='ci'){self.el.querySelector('[data-action="add"]').click()}})};

function renderKbPicker(c,ids){var list=D.knowledge.filter(function(k){return k.enabled});if(!list.length){c.innerHTML='<div class="hint">知识库为空</div>';return}var h='';for(var i=0;i<list.length;i++){var k=list[i];var on=ids.indexOf(k.id)!==-1;h+='<div class="kb-item'+(on?' on':'')+'" data-kid="'+k.id+'"><div class="kb-check">'+(on?'\u2713':'')+'</div><div class="kb-name">'+esc(k.name||'未命名')+'</div><div class="kb-type">'+(k.keywords&&k.keywords.length?k.keywords.slice(0,3).join(','):'常驻')+'</div></div>'}c.innerHTML=h;c.onclick=function(e){var el=e.target.closest('.kb-item');if(!el)return;var id=el.getAttribute('data-kid');var idx=ids.indexOf(id);if(idx!==-1)ids.splice(idx,1);else ids.push(id);el.classList.toggle('on');el.querySelector('.kb-check').textContent=el.classList.contains('on')?'\u2713':''}}
function renderInspirePicker(c,ids){var list=D.storage.filter(function(s){return s.type==='inspire'});if(!list.length){c.innerHTML='';return}var h='';for(var i=0;i<list.length;i++){var s=list[i];var on=ids.indexOf(s.id)!==-1;h+='<div class="inspire-pick'+(on?' on':'')+'" data-iid="'+s.id+'"><div class="kb-check">'+(on?'\u2713':'')+'</div><div class="ip-b">'+esc((s.content||s.title||'').slice(0,80))+'</div></div>'}c.innerHTML=h;c.onclick=function(e){var el=e.target.closest('.inspire-pick');if(!el)return;var id=el.getAttribute('data-iid');var idx=ids.indexOf(id);if(idx!==-1)ids.splice(idx,1);else ids.push(id);el.classList.toggle('on');el.querySelector('.kb-check').textContent=el.classList.contains('on')?'\u2713':''}}
function collectTags(st){var p=[];for(var k in st){if(st[k]&&st[k].length)p.push((TAG_NAMES[k]||k)+'：'+st[k].join('、'))}return p.join('\n')||'（未选择）'}

function openGen(type,title){var tg=TAGS[type]||{};var gks=Object.keys(tg);openScreen(function(el){var selTags={};for(var i=0;i<gks.length;i++)selTags[gks[i]]=[];var kbSel=D.knowledge.filter(function(k){return k.enabled}).map(function(k){return k.id});var inspireSel=[];el.innerHTML=navHTML(title);var bd=document.createElement('div');bd.className='content';var h='<div class="inspire-box"><textarea id="g-input" placeholder="写下你的灵感…"></textarea></div>';var hasIns=D.storage.some(function(s){return s.type==='inspire'});if(hasIns)h+='<div class="gen-sec"><div class="gen-sec-t">导入灵感</div><div id="iPick"></div></div>';for(var i=0;i<gks.length;i++){h+='<div class="gen-sec"><div class="gen-sec-t">'+(TAG_NAMES[gks[i]]||gks[i])+'</div><div id="tg_'+gks[i]+'"></div></div>'}h+='<div class="gen-sec"><div class="gen-sec-t">知识库</div><div id="kbP"></div></div>';h+='<button class="btn primary" id="genBtn" style="margin-top:6px">生成'+esc(title)+'</button>';bd.innerHTML=h;el.appendChild(bd);for(var i=0;i<gks.length;i++){var picker=new TagPicker(type,gks[i],selTags);bd.querySelector('#tg_'+gks[i]).appendChild(picker.el)}renderKbPicker(bd.querySelector('#kbP'),kbSel);if(hasIns)renderInspirePicker(bd.querySelector('#iPick'),inspireSel);bd.querySelector('#genBtn').onclick=function(){var input=bd.querySelector('#g-input').value.trim();var pi=collectInspires(inspireSel);if(pi)input=(input?input+'\n\n':'')+'\u3010导入的灵感\u3011\n'+pi;var allEmpty=true;for(var k in selTags){if(selTags[k]&&selTags[k].length){allEmpty=false;break}}if(!input&&allEmpty)return toast('写点灵感或选几个标签');if(!D.api.apiKey)return toast('请先配置API');var ts=collectTags(selTags);var kb=buildKB(input,kbSel);var tpl=getT(type).replace('{input}',input||'（未填写）').replace('{tags}',ts).replace('{knowledge}',kb||'').replace('{ref}','').replace('{manual}','');showLd('生成'+title+'中');callLLM([{role:'system',content:getP(type)},{role:'user',content:tpl}]).then(function(out){hideLd();showResult(type,title,input,out,{sys:getP(type),user:tpl})}).cat function openChatApp(){openScreen(function(el){el.style.overflow='hidden';var currentTab='chats';render();
  function render(){
    var h='<div class="chat-app"><div class="chat-body" id="chatBody"></div>';
    h+='<div class="chat-bottom-bar">';

    else if(currentTab==='contacts')renderContacts(body);

    else if(currentTab==='cuser')renderCUser(body);
  }
  function renderChatList(p){
    var h='<div class="chat-list-header"><h1 onclick="back()">聊天</h1><button class="nav-act solid" id="nc">+</button></div>';
    if(!D.chats.length){h+='<div class="empty" style="padding-top:60px">还没有聊天<br>从存储导入角色或新建</div>'}

function editCWE(arr,idx,onDone){var item=arr[idx];if(!item)return;showModal('<h3>编辑世界书条目</h3><div class="field"><label>名称</label><input id="ewn" value="'+esc(item.name)+'"></div><div class="field"><label>注入位置</label><select id="ewp"><option value="before"'+(item.position==='before'?' selected':'')+'>前段</option><option value="middle"'+(item.position==='middle'?' selected':'')+'>中段</option><option value="after"'+(item.position==='after'?' selected':'')+'>后段</option></select></div><div class="field"><label>触发关键词（逗号分隔，留空=常驻）</label><input id="ewk" value="'+esc(item.keywords||'')+'"></div><div class="field"><label>内容</label><textarea id="ewc" style="min-height:100px">'+esc(item.content)+'</textarea></div><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span style="font-size:11px">启用</span><label class="switch"><input type="checkbox" id="ewe" '+(item.enabled?'checked':'')+'><span class="slider"></span></label></div><div class="btn-row"><button class="btn primary" id="ewS">保存</button><button class="btn danger" id="ewD">删除</button></div>');$('ewS').onclick=function(){item.name=$('ewn').value.trim();item.position=$('ewp').value;item.keywords=$('ewk').value.trim();item.content=$('ewc').value;item.enabled=$('ewe').checked;save();closeModal();if(onDone)onDone()};$('ewD').onclick=function(){arr.splice(idx,1);save();closeModal();if(onDone)onDone()}}

function buildCS(ct,chat){var msgs=[];if(!ct)return msgs;var bP=[];if(ct.worldview)bP.push(ct.worldview);var wb=ct.worldbook||[];for(var i=0;i<wb.length;i++){if(wb[i].enabled&&wb[i].position==='before'&&(!wb[i].keywords||sT(wb[i].keywords,chat)))bP.push('['+wb[i].name+']\n'+wb[i].content)}for(var i=0;i<D.chatWorldbook.length;i++){var cw=D.chatWorldbook[i];if(cw.enabled&&cw.position==='before'&&(!cw.keywords||sT(cw.keywords,chat)))bP.push('['+cw.name+']\n'+cw.content)}if(bP.length)msgs.push({role:'system',content:bP.join('\n\n')});if(ct.persona)msgs.push({role:'system',content:ct.persona});var mP=[];for(var i=0;i<wb.length;i++){if(wb[i].enabled&&wb[i].position==='middle'&&(!wb[i].keywords||sT(wb[i].keywords,chat)))mP.push('['+wb[i].name+']\n'+wb[i].content)}for(var i=0;i<D.chatWorldbook.length;i++){var cw=D.chatWorldbook[i];if(cw.enabled&&cw.position==='middle'&&(!cw.keywords||sT(cw.keywords,chat)))mP.push('['+cw.name+']\n'+cw.content)}if(mP.length)msgs.push({role:'system',content:mP.join('\n\n')});var mask=getMask(chat.maskId)||getDefaultMask();var userS=ct.userSetting||(mask?mask.content:'')||D.chatUserSetting||'';if(userS)msgs.push({role:'system',content:'[User设定]\n'+userS});var aP=[];for(var i=0;i<wb.length;i++){if(wb[i].enabled&&wb[i].position==='after'&&(!wb[i].keywords||sT(wb[i].keywords,chat)))aP.push('['+wb[i].name+']\n'+wb[i].content)}for(var i=0;i<D.chatWorldbook.length;i++){var cw=D.chatWorldbook[i];if(cw.enabled&&cw.position==='after'&&(!cw.keywords||sT(cw.keywords,chat)))aP.push('['+cw.name+']\n'+cw.content)}if(aP.length)msgs.push({role:'system',content:aP.join('\n\n')});return msgs}
function sT(kw,chat){if(!kw)return true;var ks=kw.split(',').map(function(s){return s.trim()}).filter(Boolean);if(!ks.length)return true;var r='';var m=chat.messages||[];var s=Math.max(0,m.length-5);for(var i=s;i<m.length;i++)r+=m[i].content+'';for(var i=0;i<ks.length;i++){if(r.indexOf(ks[i])!==-1)return true}return false}

// ========== 启动 ==========
applyTheme();
renderHome();
